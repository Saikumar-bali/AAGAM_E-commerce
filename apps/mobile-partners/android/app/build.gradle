apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Real Firebase builds use the application-specific file supplied outside Git.
// CI and local non-FCM debug builds remain compilable without fake credentials.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

react {
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    hermesCommand = "../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc"
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def releaseStorePath = System.getenv("AAGAM_ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("AAGAM_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("AAGAM_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("AAGAM_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.aagampartners"
    defaultConfig {
        applicationId "com.aagampartners"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (project.findProperty("VERSION_CODE") ?: "1").toString().toInteger()
        versionName (project.findProperty("VERSION_NAME") ?: "1.0").toString()
    }

    signingConfigs {
        debug {}
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        // Android Gradle Plugin creates/uses the standard debug keystore. Do not
        // point at an untracked app/debug.keystore file.
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: true]
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            manifestPlaceholders = [usesCleartextTraffic: false]
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.google.android.gms:play-services-location:21.3.0")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
