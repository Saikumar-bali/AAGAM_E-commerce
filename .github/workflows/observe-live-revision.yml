name: Observe Live Revision

on:
  push:
    branches: ["qa/observe-live-revision-20260722"]
    paths: [".github/workflows/observe-live-revision.yml"]
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/observe-live-revision.yml"]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect failed live QA provisioning
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/88837867659/logs" > /tmp/qa-job.log
          grep -Ein 'Prisma|Error|P[0-9]{4}|Manual Test|opening|bootstrap|transaction|constraint|foreign|unique|store owner|qa store' /tmp/qa-job.log \
            | tail -n 100 || true
