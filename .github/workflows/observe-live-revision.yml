name: Observe Live Revision

on:
  push:
    branches: ["qa/observe-live-revision-20260722"]
    paths: [".github/workflows/observe-live-revision.yml"]
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/observe-live-revision.yml"]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Observe forced cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/force-live-qa-cleanup.yml/runs?branch=main&per_page=5" \
            | jq -r '.workflow_runs[] | "CLEANUP_RUN id=\(.id) status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha) event=\(.event)"'
