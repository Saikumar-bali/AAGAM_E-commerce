name: Observe Live Revision

on:
  push:
    branches: ["qa/observe-live-revision-20260722"]
    paths: [".github/workflows/observe-live-revision.yml"]
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/observe-live-revision.yml"]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cleanup failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/88840863567/logs" > /tmp/qa-job.log
          printf '%s\n' '--- CLEANUP-RELATED LINES ---'
          grep -Ein 'Restore catalogue|cleanup|productRestored|productRemoved|Prisma|Error|P[0-9]{4}|constraint|foreign|deleteMany|updateMany|DbNull|Invalid' /tmp/qa-job.log \
            | tail -n 180 || true
          printf '%s\n' '--- FINAL 180 LINES ---'
          tail -n 180 /tmp/qa-job.log
