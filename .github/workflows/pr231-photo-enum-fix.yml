name: PR231 Photo Verification Enum Fix

on:
  push:
    branches: [fix/support-otp-photo-admin-create-ux]
    paths:
      - ".github/workflows/pr231-photo-enum-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-otp-photo-admin-create-ux
          fetch-depth: 0

      - name: Persist distinct rider photo verification method
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          schema = Path('packages/database/prisma/schema.prisma')
          text = schema.read_text()
          old = '''enum DeliveryVerificationMethod {
            CUSTOMER_OTP_PIN
            TRUSTED_DROP
            SECURITY_RECEPTION
          }'''
          new = '''enum DeliveryVerificationMethod {
            CUSTOMER_OTP_PIN
            TRUSTED_DROP
            SECURITY_RECEPTION
            RIDER_PHOTO_EVIDENCE
          }'''
          if old not in text:
              raise SystemExit('DeliveryVerificationMethod enum block not found exactly once')
          schema.write_text(text.replace(old, new, 1))

          service = Path('apps/api-gateway/src/orders/delivery-photo-proof.service.ts')
          service_text = service.read_text()
          old_service = '''            // Kept in the legacy non-OTP enum bucket until the dedicated
            // verification-method migration lands; proofType below remains authoritative.
            verificationMethod: 'SECURITY_RECEPTION','''
          new_service = '''            verificationMethod: 'RIDER_PHOTO_EVIDENCE','''
          if old_service not in service_text:
              raise SystemExit('Temporary legacy photo verification assignment not found')
          service.write_text(service_text.replace(old_service, new_service, 1))

          migration = Path('packages/database/prisma/migrations/20260809052000_rider_photo_delivery_verification_method/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Persist Rider photo fallback as a first-class delivery verification method.\nALTER TYPE "DeliveryVerificationMethod" ADD VALUE IF NOT EXISTS 'RIDER_PHOTO_EVIDENCE';\n''')

          Path('.github/workflows/pr231-photo-enum-fix.yml').unlink()
          PY

          npx prisma format --schema packages/database/prisma/schema.prisma
          npx prisma validate --schema packages/database/prisma/schema.prisma

          git config user.name "AAGAM CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(delivery): persist rider photo verification method"
          git push origin HEAD:fix/support-otp-photo-admin-create-ux
