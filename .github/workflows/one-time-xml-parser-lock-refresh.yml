# Temporary branch-only lock refresh. Delete after it pushes package-lock.json.
name: One-time XML Parser Lock Refresh

on:
  push:
    branches:
      - agent/security-and-issue-hardening
    paths:
      - .github/workflows/one-time-xml-parser-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'Saikumar-bali/AAGAM_E-commerce' && github.ref == 'refs/heads/agent/security-and-issue-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-and-issue-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Refresh lock safely
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
          git diff --check
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            echo "Expected only package-lock.json, got: $changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock patched RN CLI XML parser'
          git push origin HEAD:agent/security-and-issue-hardening
