name: Agent Refresh Pickup Contract

on:
  push:
    branches: [agent/rider-portal-production-readiness]

permissions:
  contents: write

jobs:
  refresh-contract:
    if: ${{ !contains(github.event.head_commit.message, '[skip-pickup-contract-fixer]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rider-portal-production-readiness
          fetch-depth: 0

      - name: Align contract with secure QR and exact quantities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api-gateway/src/order-delivery-mobile-ui.contract.spec.ts')
          text = path.read_text()
          replacements = [
              ("    expect(rider).toContain('Verify complete checklist');",
               "    expect(rider).toContain('Verify exact checklist');"),
              ("    expect(rider).toContain('Verify store handoff');",
               "    expect(rider).toContain('Secure store handoff');"),
              ("    expect(rider).not.toContain('QR_CODE');",
               "    expect(rider).toContain(\"method: 'QR_CODE'\");\n    expect(rider).toContain('PartnerQrScanner.scan()');"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected contract fragment not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/agent-refresh-pickup-contract.yml').unlink()
          PY

      - name: Commit refreshed contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api-gateway/src/order-delivery-mobile-ui.contract.spec.ts .github/workflows/agent-refresh-pickup-contract.yml
          git commit -m "test(rider): align pickup contract with QR workflow [skip-pickup-contract-fixer]"
          git push origin HEAD:agent/rider-portal-production-readiness
