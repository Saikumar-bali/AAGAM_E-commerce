name: Order Delivery Mobile UI

on:
  push:
    branches: [agent/rider-platform-hardening-final]
    paths:
      - ".github/workflows/order-delivery-mobile-ui.yml"
      - ".github/workflows/finalize-rider-hardening.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api-gateway/src/orders/**"
      - "apps/api-gateway/src/order-delivery-mobile-ui.contract.spec.ts"
      - "apps/mobile-customer/**"
      - "apps/mobile-partners/**"
      - "packages/database/prisma/schema.prisma"
      - "packages/database/prisma/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/order-delivery-mobile-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: order-delivery-mobile-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.22.3"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_mobile_ui_contract"

jobs:
  finalize-rider-hardening:
    if: github.event_name == 'push' && github.ref_name == 'agent/rider-platform-hardening-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rider-platform-hardening-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Apply and validate final Rider fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if old not in source:
                  raise SystemExit(f"Expected text was not found in {path}: {old[:100]}")
              target.write_text(source.replace(old, new, 1))

          replace(
              'apps/mobile-partners/src/screens/rider/RiderProfileScreen.tsx',
              "const earningsQuery = useQuery({ queryKey: EARNINGS_KEY, queryFn: riderService.getEarnings, retry: 1 });",
              "const earningsQuery = useQuery({ queryKey: EARNINGS_KEY, queryFn: () => riderService.getEarnings(), retry: 1 });",
          )
          replace(
              'apps/mobile-partners/src/notifications/PartnerPushCoordinator.tsx',
              "      remember(notificationDedupeKey(payload));\n      await Promise.all([invalidate(payload.eventType), acknowledgeOpen(payload)]);",
              "      if (!remember(`${notificationDedupeKey(payload)}:opened`)) return;\n      await Promise.all([invalidate(payload.eventType), acknowledgeOpen(payload)]);",
          )
          replace(
              'apps/api-gateway/src/orders/rider-arrival-evidence.ts',
              "  if (\n    finite(input.evidence.accuracyMetres)\n    && Number(input.evidence.accuracyMetres) > input.policy.maxAccuracyMetres\n  ) {\n    throw new BadRequestException(\n      `GPS accuracy must be within ${input.policy.maxAccuracyMetres} metres`,\n    );\n  }",
              "  if (!finite(input.evidence.accuracyMetres) || Number(input.evidence.accuracyMetres) <= 0) {\n    throw new BadRequestException('GPS accuracy is required for verified Rider evidence');\n  }\n  if (Number(input.evidence.accuracyMetres) > input.policy.maxAccuracyMetres) {\n    throw new BadRequestException(\n      `GPS accuracy must be within ${input.policy.maxAccuracyMetres} metres`,\n    );\n  }",
          )
          replace(
              'apps/api-gateway/src/orders/rider-arrival-evidence.spec.ts',
              "  it('computes distance deterministically', () => {\n    expect(distanceMetresBetween(destination, destination)).toBe(0);\n  });",
              "  it('requires accuracy for verified evidence', () => {\n    expect(() => validateRiderArrivalEvidence({\n      evidence: {\n        latitude: 17.7301,\n        longitude: 83.3101,\n        capturedAt: '2026-08-04T00:59:30.000Z',\n      },\n      destination,\n      destinationType: 'STORE',\n      policy,\n      now,\n    })).toThrow(/accuracy is required/);\n  });\n\n  it('computes distance deterministically', () => {\n    expect(distanceMetresBetween(destination, destination)).toBe(0);\n  });",
          )
          replace(
              'apps/mobile-partners/src/notifications.contract.spec.ts',
              "    expect(coordinator).toContain('pendingNavigation.current = [command]');",
              "    expect(coordinator).toContain('pendingNavigation.current = [command]');\n    expect(coordinator).toContain('notificationDedupeKey(payload)}:opened');",
          )
          PY

          npm ci --no-audit --no-fund
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npm run build --workspace @aagam/types
          npm run build --workspace @aagam/utils
          npm run build --workspace @aagam/database
          npm run build --workspace @aagam/api-gateway
          npm run typecheck --workspace=AagamPartners
          npm test --workspace=AagamPartners -- --runInBand
          npm run test:ci --workspace=@aagam/api-gateway -- rider-arrival-evidence.spec.ts --runInBand

          git fetch origin main
          git checkout origin/main -- .github/workflows/order-delivery-mobile-ui.yml
          rm -f .github/workflows/finalize-rider-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(rider): finalize lifecycle and GPS contracts'
          git push origin HEAD:agent/rider-platform-hardening-final

  mobile-ui-contracts:
    if: github.event_name == 'pull_request'
    name: Mobile UI contracts and types
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Build shared TypeScript packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Typecheck Customer app
        run: npm run typecheck --workspace=AagamCustomer

      - name: Test Customer delivery-code and checkout contracts
        run: npm test --workspace=AagamCustomer

      - name: Typecheck Partners app
        run: npm run typecheck --workspace=AagamPartners

      - name: Test Rider and Store pickup helpers
        run: npm run test:order-delivery-ui --workspace=AagamPartners

      - name: Test backend and UI route contracts
        run: npx jest --config apps/api-gateway/jest.config.js --runInBand --runTestsByPath apps/api-gateway/src/order-delivery-mobile-ui.contract.spec.ts

      - name: Verify no legacy pickup bypass is reintroduced
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings '/orders/assign' apps/mobile-customer/src apps/mobile-partners/src; then
            echo 'Legacy public assignment path must not be used by mobile runtime code.'
            exit 1
          fi
          if grep -R --line-number --fixed-strings '/orders/rider/queue' apps/mobile-customer/src apps/mobile-partners/src; then
            echo 'Legacy public rider queue must not be used by mobile runtime code.'
            exit 1
          fi
          grep -Fq '/otp/customer' apps/mobile-customer/src/components/orders/DeliveryCodeCard.tsx
          grep -Fq '/pickup/verify' apps/mobile-partners/src/api/pickupOperationsService.ts
          grep -Fq '/riders/portal/pickup' apps/mobile-partners/src/api/pickupOperationsService.ts
          grep -Fq '"test": "jest --runInBand"' apps/mobile-customer/package.json
          test -f apps/mobile-customer/src/domain/deliveryCode.spec.ts
          test ! -e apps/mobile-customer/scripts/test-delivery-code.js
