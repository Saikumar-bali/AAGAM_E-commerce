name: Apply PR 97 Source Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase/store-assortment-inventory-ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/store-assortment-inventory-ownership
          fetch-depth: 0
      - name: Apply source and regression-test fixes
        shell: bash
        run: |
          if grep -q "roles?: Role\[\]" apps/api-gateway/src/stores/store.service.ts; then
            echo "Reviewed source fixes are already applied."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/patch-pr97-review-fixes.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])
          Path('/tmp/pr97_source_patch.py').write_text(script)
          PY
          python /tmp/pr97_source_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api-gateway/src/stores/store.service.ts \
            apps/api-gateway/src/store-assortment.spec.ts \
            apps/mobile-partners/src/domain/storeInventory.ts \
            apps/mobile-partners/src/domain/storeInventory.spec.ts \
            apps/mobile-partners/src/screens/store/StoreInventoryScreen.tsx \
            'apps/admin-dashboard/src/app/(store)/store/inventory/page.tsx' \
            apps/admin-dashboard/e2e/store-assortment-inventory.spec.ts
          git commit -m "fix: address inventory ownership review blockers"
          git push origin HEAD:phase/store-assortment-inventory-ownership
