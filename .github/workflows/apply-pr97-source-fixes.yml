name: Apply PR 97 Source Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase/store-assortment-inventory-ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/store-assortment-inventory-ownership
          fetch-depth: 0
      - name: Extract reviewed source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-pr97-review-fixes.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/pr97_source_patch.py').write_text(script)
          PY
      - name: Apply source and regression-test fixes
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          if grep -q "roles?: Role\[\]" apps/api-gateway/src/stores/store.service.ts; then
            echo "Reviewed source fixes are already applied." | tee /tmp/pr97-patch.log
            exit 0
          fi
          python /tmp/pr97_source_patch.py > /tmp/pr97-patch.log 2>&1
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr97-source-patch-diagnostics
          path: /tmp/pr97-patch.log
          retention-days: 2
      - name: Commit source fixes
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/api-gateway/src/stores/store.service.ts \
            apps/api-gateway/src/store-assortment.spec.ts \
            apps/mobile-partners/src/domain/storeInventory.ts \
            apps/mobile-partners/src/domain/storeInventory.spec.ts \
            apps/mobile-partners/src/screens/store/StoreInventoryScreen.tsx \
            'apps/admin-dashboard/src/app/(store)/store/inventory/page.tsx' \
            apps/admin-dashboard/e2e/store-assortment-inventory.spec.ts; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api-gateway/src/stores/store.service.ts \
            apps/api-gateway/src/store-assortment.spec.ts \
            apps/mobile-partners/src/domain/storeInventory.ts \
            apps/mobile-partners/src/domain/storeInventory.spec.ts \
            apps/mobile-partners/src/screens/store/StoreInventoryScreen.tsx \
            'apps/admin-dashboard/src/app/(store)/store/inventory/page.tsx' \
            apps/admin-dashboard/e2e/store-assortment-inventory.spec.ts
          git commit -m "fix: address inventory ownership review blockers"
          git push origin HEAD:phase/store-assortment-inventory-ownership
      - name: Fail when patch failed
        if: steps.patch.outcome == 'failure'
        run: exit 1
