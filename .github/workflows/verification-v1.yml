name: Verification V1 Firebase PNV

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verification-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  finalize-pr231-photo-enum:
    name: Finalize PR231 photo verification enum
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/support-otp-photo-admin-create-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Persist first-class Rider photo verification method
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          schema = Path('packages/database/prisma/schema.prisma')
          text = schema.read_text()
          old = '''enum DeliveryVerificationMethod {
  CUSTOMER_OTP_PIN
  TRUSTED_DROP
  SECURITY_RECEPTION
}'''
          new = '''enum DeliveryVerificationMethod {
  CUSTOMER_OTP_PIN
  TRUSTED_DROP
  SECURITY_RECEPTION
  RIDER_PHOTO_EVIDENCE
}'''
          if 'RIDER_PHOTO_EVIDENCE' not in text:
              if old not in text:
                  raise SystemExit('DeliveryVerificationMethod block not found')
              schema.write_text(text.replace(old, new, 1))

          service = Path('apps/api-gateway/src/orders/delivery-photo-proof.service.ts')
          text = service.read_text()
          legacy = '''            // Kept in the legacy non-OTP enum bucket until the dedicated
            // verification-method migration lands; proofType below remains authoritative.
            verificationMethod: 'SECURITY_RECEPTION','''
          if "verificationMethod: 'RIDER_PHOTO_EVIDENCE'" not in text:
              if legacy not in text:
                  raise SystemExit('temporary delivery photo method not found')
              service.write_text(text.replace(legacy, "            verificationMethod: 'RIDER_PHOTO_EVIDENCE',", 1))

          migration = Path('packages/database/prisma/migrations/20260809052000_rider_photo_delivery_verification_method/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Persist Rider photo fallback as a first-class delivery verification method.\nALTER TYPE "DeliveryVerificationMethod" ADD VALUE IF NOT EXISTS 'RIDER_PHOTO_EVIDENCE';\n''')
          PY

          # This workflow is a one-commit bootstrap only. Restore the clean
          # workflow from its parent so the branch does not retain CI mutation logic.
          git show HEAD^:.github/workflows/verification-v1.yml > .github/workflows/verification-v1.yml

          git diff --check
          grep -A5 -F 'enum DeliveryVerificationMethod {' packages/database/prisma/schema.prisma | grep -F 'RIDER_PHOTO_EVIDENCE'
          grep -F "verificationMethod: 'RIDER_PHOTO_EVIDENCE'" apps/api-gateway/src/orders/delivery-photo-proof.service.ts
          test -s packages/database/prisma/migrations/20260809052000_rider_photo_delivery_verification_method/migration.sql

          git config user.name "AAGAM CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(delivery): persist rider photo verification method"
          git push origin "HEAD:${HEAD_BRANCH}"
