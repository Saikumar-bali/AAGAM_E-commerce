name: Agent source export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-source-export.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record source identity
        run: |
          git rev-parse HEAD
          git status --short
      - name: Archive source tree
        run: |
          tar --exclude=.git -czf /tmp/aagam-source.tgz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: aagam-source-tree
          path: /tmp/aagam-source.tgz
          if-no-files-found: error
          retention-days: 1
