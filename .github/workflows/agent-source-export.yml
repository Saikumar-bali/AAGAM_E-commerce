name: Agent apply production completion

on:
  push:
    branches:
      - agent/subscription-production-completion
    paths:
      - .github/agent-production.patch.gz
      - .github/workflows/agent-source-export.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/subscription-production-completion

      - name: Apply repository patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/agent-production.patch.gz
          gzip -dc .github/agent-production.patch.gz > /tmp/agent-production.patch
          git apply --check /tmp/agent-production.patch
          git apply /tmp/agent-production.patch
          rm -f .github/agent-production.patch.gz
          rm -f .github/workflows/agent-source-export.yml
          git diff --check

      - name: Commit exact applied result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AAGAM Production Completion Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(subscriptions): harden production subscription delivery"
          git push origin HEAD:agent/subscription-production-completion

# Triggered after the staged patch blob exists on the branch.
