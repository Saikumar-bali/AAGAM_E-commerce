name: Auto Dispatch Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api-gateway/src/orders/**"
      - "apps/api-gateway/src/riders/**"
      - "apps/api-gateway/src/notifications/**"
      - "apps/api-gateway/src/auto-dispatch-*.spec.ts"
      - "apps/mobile-partners/**"
      - "apps/admin-dashboard/src/app/(admin)/admin/dispatch/**"
      - "packages/database/prisma/schema.prisma"
      - "packages/database/prisma/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/auto-dispatch-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-dispatch-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.3"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_auto_dispatch_recovery"
  NODE_ENV: test
  AUTO_DISPATCH_ENABLED: "true"
  AUTO_DISPATCH_MAX_PICKUP_KM: "8"
  AUTO_DISPATCH_LOCATION_MAX_AGE_SECONDS: "180"
  AUTO_DISPATCH_RETRY_COOLDOWN_SECONDS: "30"
  AUTO_DISPATCH_RECONCILE_LIMIT: "50"
  DELIVERY_OTP_SECRET: "auto-dispatch-recovery-ci-only-secret"
  NOTIFICATION_WORKER_DISABLED: "true"

jobs:
  apply-final-codex-fixes:
    name: Apply final Codex fixes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 130
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Apply atomic review patch
        shell: bash
        run: |
          if [ ! -f .github/workflows/pr130-final-codex-fixes.yml ]; then
            echo "No staged PR 130 patch marker; nothing to apply."
            exit 0
          fi

          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/api-gateway/src/orders/auto-dispatch.service.ts',
              '''  async dispatchWaitingJobs(limitInput = this.reconcileLimit()) {
            if (!this.isEnabled()) return { scanned: 0, offered: 0 };

            const limit = Math.max(1, Math.min(250, Math.floor(limitInput || this.reconcileLimit())));
            const jobs = await prisma.deliveryJob.findMany({
              where: {
                status: DeliveryJobStatus.WAITING_FOR_DISPATCH,
                currentRiderId: null,
                assignments: {
                  none: {
                    status: {
                      in: [
                        DispatchAssignmentStatus.OFFERED,
                        DispatchAssignmentStatus.ACCEPTED,
                      ],
                    },
                  },
                },
              },
              select: { id: true },
              orderBy: { updatedAt: 'asc' },
              take: limit,
            });

            let offered = 0;
            for (const job of jobs) {
              const outcome = await this.dispatchNearestRider(job.id).catch((error) => {
                this.logger.warn(
                  `Waiting-job dispatch failed for ${job.id}: ${error instanceof Error ? error.message : String(error)}`,
                );
                return null;
              });
              if (outcome?.offered) offered += 1;
            }

            return { scanned: jobs.length, offered };
          }
''',
              '''  async dispatchWaitingJobs(limitInput = this.reconcileLimit()) {
            if (!this.isEnabled()) return { scanned: 0, offered: 0 };

            const offerLimit = Math.max(
              1,
              Math.min(250, Math.floor(limitInput || this.reconcileLimit())),
            );
            const pageSize = Math.max(25, offerLimit);
            const baseWhere: Prisma.DeliveryJobWhereInput = {
              status: DeliveryJobStatus.WAITING_FOR_DISPATCH,
              currentRiderId: null,
              assignments: {
                none: {
                  status: {
                    in: [
                      DispatchAssignmentStatus.OFFERED,
                      DispatchAssignmentStatus.ACCEPTED,
                    ],
                  },
                },
              },
            };

            let scanned = 0;
            let offered = 0;
            let after: { updatedAt: Date; id: string } | null = null;

            while (offered < offerLimit) {
              const jobs = await prisma.deliveryJob.findMany({
                where: {
                  ...baseWhere,
                  ...(after
                    ? {
                        OR: [
                          { updatedAt: { gt: after.updatedAt } },
                          { updatedAt: after.updatedAt, id: { gt: after.id } },
                        ],
                      }
                    : {}),
                },
                select: { id: true, updatedAt: true },
                orderBy: [{ updatedAt: 'asc' }, { id: 'asc' }],
                take: pageSize,
              });
              if (jobs.length === 0) break;

              for (const job of jobs) {
                scanned += 1;
                const outcome = await this.dispatchNearestRider(job.id).catch((error) => {
                  this.logger.warn(
                    `Waiting-job dispatch failed for ${job.id}: ${error instanceof Error ? error.message : String(error)}`,
                  );
                  return null;
                });
                if (outcome?.offered) {
                  offered += 1;
                  if (offered >= offerLimit) break;
                }
              }

              const last = jobs[jobs.length - 1];
              after = { updatedAt: last.updatedAt, id: last.id };
              if (jobs.length < pageSize) break;
            }

            return { scanned, offered };
          }
''',
          )

          replace_once(
              'packages/database/prisma/schema.prisma',
              '''  orders                   Order[]
            locationPings            RiderLocationPing[]
            deliveryJobs             DeliveryJob[]               @relation("DeliveryJobCurrentRider")
''',
              '''  orders                   Order[]
            locationPings            RiderLocationPing[]
            availabilityLocation     RiderAvailabilityLocation?
            deliveryJobs             DeliveryJob[]               @relation("DeliveryJobCurrentRider")
''',
          )
          replace_once(
              'packages/database/prisma/schema.prisma',
              '''  updatedAt                DateTime                    @updatedAt
          }

          enum OrderStatus {
''',
              '''  updatedAt                DateTime                    @updatedAt
          }

          model RiderAvailabilityLocation {
            riderProfileId String       @id
            riderProfile   RiderProfile @relation(fields: [riderProfileId], references: [id], onDelete: Cascade)
            latitude       Float
            longitude      Float
            capturedAt     DateTime     @default(now())
            updatedAt      DateTime     @updatedAt

            @@index([capturedAt])
          }

          enum OrderStatus {
''',
          )

          anchor = '''  it('prevents active Riders from going offline and concurrent jobs from double-offering one Rider', async () => {
'''
          regression = '''  it('pages past ineligible waiting jobs instead of starving a later dispatchable job', async () => {
            const blocked = await waiting(`ineligible_${Date.now()}`);
            const target = await waiting(`eligible_${Date.now()}`);
            await prisma.store.update({
              where: { id: blocked.store.id },
              data: { latitude: 18.2, longitude: 83.8 },
            });
            const recovery = await rider('paged_recovery', 'ONLINE', 17.7004, 83.3004);

            const result = await dispatch().dispatchWaitingJobs(1);

            expect(result).toEqual({ scanned: 2, offered: 1 });
            expect(
              await prisma.dispatchAssignment.findFirst({
                where: {
                  deliveryJobId: target.job.id,
                  riderProfileId: recovery.profile.id,
                  status: DispatchAssignmentStatus.OFFERED,
                },
              }),
            ).not.toBeNull();
          });

'''
          replace_once(
              'apps/api-gateway/src/auto-dispatch-recovery.e2e.spec.ts',
              anchor,
              regression + anchor,
          )

          replace_once(
              'apps/api-gateway/src/auto-dispatch-recovery.contract.spec.ts',
              '''    expect(source).toContain('dispatchWaitingJobs');
            expect(source).toContain('assignments: {');
            expect(source).toContain('none: {');
            expect(source).toContain("isolationLevel: 'Serializable'");
          });
''',
              '''    expect(source).toContain('dispatchWaitingJobs');
            expect(source).toContain('while (offered < offerLimit)');
            expect(source).toContain('{ updatedAt: { gt: after.updatedAt } }');
            expect(source).toContain("orderBy: [{ updatedAt: 'asc' }, { id: 'asc' }]");
            expect(source).toContain('assignments: {');
            expect(source).toContain('none: {');
            expect(source).toContain("isolationLevel: 'Serializable'");
          });
''',
          )
          contract_anchor = '''  it('runs waiting-job recovery from both the notification worker and Rider online transition', () => {
'''
          schema_contract = '''  it('keeps the dedicated Rider availability table represented in the Prisma schema', () => {
            const schema = read('packages/database/prisma/schema.prisma');
            expect(schema).toContain('model RiderAvailabilityLocation');
            expect(schema).toContain('availabilityLocation     RiderAvailabilityLocation?');
            expect(schema).toContain('riderProfileId String       @id');
            expect(schema).toContain('@@index([capturedAt])');
          });

'''
          replace_once(
              'apps/api-gateway/src/auto-dispatch-recovery.contract.spec.ts',
              contract_anchor,
              schema_contract + contract_anchor,
          )
          PY

          git show HEAD^:.github/workflows/auto-dispatch-recovery.yml > .github/workflows/auto-dispatch-recovery.yml
          rm -f .github/workflows/pr130-final-codex-fixes.yml
          git diff --check

          git config user.name "Saikumar Bali"
          git config user.email "178761198+Saikumar-bali@users.noreply.github.com"
          git add -A
          git commit -m "address final codex dispatch review"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  recovery-e2e:
    name: Recovery E2E and builds
    needs: apply-final-codex-fixes
    if: always() && needs.apply-final-codex-fixes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_auto_dispatch_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and generate Prisma client
        run: |
          npx prisma validate --schema packages/database/prisma/schema.prisma
          npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Apply all database migrations
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Build shared packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Run auto-dispatch recovery and existing delivery contracts
        run: >-
          npx jest --config apps/api-gateway/jest.config.js --runInBand --runTestsByPath
          apps/api-gateway/src/auto-dispatch-recovery.contract.spec.ts
          apps/api-gateway/src/auto-dispatch-recovery.e2e.spec.ts
          apps/api-gateway/src/auto-dispatch-ci.contract.spec.ts
          apps/api-gateway/src/phase2b-mobile-delivery.spec.ts
          apps/api-gateway/src/phase5-delivery-proof-cod-failures.spec.ts
          apps/api-gateway/src/order-delivery-mobile-ui.contract.spec.ts

      - name: Build API
        run: npm run build:api

      - name: Typecheck Partners app
        run: npm run typecheck --workspace=AagamPartners

      - name: Test Partners app
        run: npm test --workspace=AagamPartners

      - name: Build admin dashboard
        run: npm run build:admin
