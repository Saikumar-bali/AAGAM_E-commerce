-- the production uniqueness guarantees used by COD settlement retry handling.
UPDATE "CodLedger"
SET "settlementReference" = NULL
WHERE "settlementReference" IS NOT NULL
  AND btrim("settlementReference") = '';

WITH ranked AS (
  SELECT
    "id",
    "settlementReference",
    row_number() OVER (
      PARTITION BY "settlementReference"
      ORDER BY "updatedAt" ASC, "id" ASC
    ) AS duplicate_rank
  FROM "CodLedger"
  WHERE "settlementReference" IS NOT NULL
)
UPDATE "CodLedger" AS ledger
SET "settlementReference" = ranked."settlementReference"
  || '-legacy-'
  || left(ledger."id", 8)
FROM ranked
WHERE ledger."id" = ranked."id"
  AND ranked.duplicate_rank > 1;

CREATE UNIQUE INDEX IF NOT EXISTS "CodLedger_settlementReference_key"
ON "CodLedger"("settlementReference");

UPDATE "CodLedgerEntry"
SET "reference" = NULL
WHERE "type" = 'DEPOSITED'::"CodLedgerEntryType"
  AND "reference" IS NOT NULL
  AND btrim("reference") = '';

UPDATE "CodLedgerEntry"
SET "reference" = btrim("reference")
WHERE "type" = 'DEPOSITED'::"CodLedgerEntryType"
  AND "reference" IS NOT NULL;

WITH ranked_deposits AS (
  SELECT
    "id",
    "reference",
    row_number() OVER (
      PARTITION BY "reference"
      ORDER BY "createdAt" ASC, "id" ASC
    ) AS duplicate_rank
  FROM "CodLedgerEntry"
  WHERE "type" = 'DEPOSITED'::"CodLedgerEntryType"
    AND "reference" IS NOT NULL
)
UPDATE "CodLedgerEntry" AS entry
SET "reference" = ranked_deposits."reference"
  || '-legacy-'
  || left(entry."id", 8)
FROM ranked_deposits
WHERE entry."id" = ranked_deposits."id"
  AND ranked_deposits.duplicate_rank > 1;

CREATE UNIQUE INDEX IF NOT EXISTS "CodLedgerEntry_deposited_reference_key"
ON "CodLedgerEntry"("reference")
WHERE "type" = 'DEPOSITED'::"CodLedgerEntryType"
  AND "reference" IS NOT NULL;
''')

