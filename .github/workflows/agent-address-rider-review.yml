    if (!job) throw new NotFoundException("Rider delivery job not found");

    const status = String(job.status);
    const currentOwner = job.currentRiderId === rider.id;
    const deliveryOwner = job.deliveryProof?.riderId === rider.id;
    const pickupOwner = job.pickupProof?.riderId === rider.id;
    const acceptedCancellation = status === "CANCELLED" && job.assignments.some(
