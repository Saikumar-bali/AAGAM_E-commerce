name: PR 97 Mobile Inventory Proof

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - phase/store-assortment-inventory-ownership

permissions:
  contents: read

jobs:
  mobile-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma
      - name: Build shared packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json
      - name: Typecheck Aagam Partners
        run: npm run typecheck --workspace=apps/mobile-partners
      - name: Test inventory draft and visibility rules
        run: npm test --workspace=apps/mobile-partners -- src/domain/storeInventory.spec.ts
