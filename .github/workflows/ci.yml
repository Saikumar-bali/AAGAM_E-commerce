name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npx turbo build --cache-dir=".turbo" --force 2>&1 | tee build-output.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-build-output-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 1

  test:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Build workspace packages for tests
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Apply all migrations to test database
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Verify migration status
        run: npx prisma migrate status --schema packages/database/prisma/schema.prisma

      - name: Run CI-safe tests
        run: npm run test:ci --workspace=apps/api-gateway
