name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.3"
  PLAYWRIGHT_WORKERS: "4"
  CI_ADMIN_EMAIL: "admin@aagam.com"
  CI_CUSTOMER_EMAIL: "customer@aagam.com"
  CI_STORE_EMAIL: "store@aagam.com"
  CI_RIDER_EMAIL: "rider@aagam.com"
  # Ephemeral test-only credential. It changes for every workflow run and is
  # never suitable for a deployed account.
  CI_TEST_PASSWORD: "Aagam-CI-${{ github.run_id }}-${{ github.run_attempt }}!"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_build"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate committed branding PNGs
        run: node scripts/validate-brand-pngs.contract.test.js

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Validate production deployment assets
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://aagam:ci-only@127.0.0.1:5432/aagam
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: aagam-ci-only-production-validator-secret
          CORS_ORIGINS: https://aagam.example.com
          NEXT_PUBLIC_API_URL: https://aagam.example.com/api
        run: |
          bash -n deploy.sh
          grep -Fq 'git reset --hard HEAD' .github/workflows/deploy.yml
          grep -Fq 'bash deploy.sh' .github/workflows/deploy.yml
          if grep -Fq 'chmod +x deploy.sh' .github/workflows/deploy.yml; then
            echo 'deploy.yml must not mutate the tracked deploy.sh file mode.'
            exit 1
          fi
          npm run check:env:prod
          if env -u CORS_ORIGINS npm run check:env:prod >/dev/null 2>&1; then
            echo "Production validation unexpectedly accepted missing CORS_ORIGINS."
            exit 1
          fi
          if env -u NEXT_PUBLIC_API_URL npm run check:env:prod >/dev/null 2>&1; then
            echo "Production validation unexpectedly accepted missing NEXT_PUBLIC_API_URL."
            exit 1
          fi

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: npx turbo build --cache-dir=".turbo" --force

  test:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"
      NODE_ENV: test
      JWT_SECRET: "aagam-ci-only-jwt-secret-change-me-in-production"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Build workspace packages for tests
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Apply all migrations to test database
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Verify migration status
        run: npx prisma migrate status --schema packages/database/prisma/schema.prisma

      - name: Run CI-safe tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci --workspace=apps/api-gateway -- --json --outputFile="$GITHUB_WORKSPACE/service-test-results.json" 2>&1 \
            | tee "$GITHUB_WORKSPACE/service-test-output.log"

      - name: Upload service test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-diagnostics
          path: |
            service-test-results.json
            service-test-output.log
          if-no-files-found: warn
          retention-days: 14

  playwright:
    name: Playwright Smoke Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase-')
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test
      JWT_SECRET: "aagam-ci-only-jwt-secret-change-me-in-production"
      PLAYWRIGHT_QA: "true"
      PLAYWRIGHT_QA_SEED: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Seed database
        run: node packages/database/seed.js
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"
          ADMIN_EMAIL: ${{ env.CI_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          CUSTOMER_EMAIL: ${{ env.CI_CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          STORE_EMAIL: ${{ env.CI_STORE_EMAIL }}
          STORE_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          RIDER_EMAIL: ${{ env.CI_RIDER_EMAIL }}
          RIDER_PASSWORD: ${{ env.CI_TEST_PASSWORD }}

      - name: Build workspace packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Playwright browsers
        shell: bash
        working-directory: apps/admin-dashboard
        run: |
          # apt-based dep install occasionally hangs on ubuntu-24.04 runners
          # (dpkg lock / slow apt). Timeout each attempt and retry so a single
          # infrastructure flake cannot cancel the whole CI job.
          for attempt in 1 2 3; do
            echo "playwright install attempt $attempt/3"
            if timeout 480 npx playwright install chromium --with-deps; then
              echo "playwright install succeeded"
              exit 0
            fi
            echo "attempt $attempt timed out or failed; retrying"
            sleep 5
          done
          echo "playwright install failed after 3 attempts"
          exit 1

      - name: Build API gateway and dashboard
        run: |
          npx turbo build --filter=@aagam/api-gateway --filter=@aagam/admin-dashboard --cache-dir=".turbo" --force

      - name: Start API gateway
        run: |
          node apps/api-gateway/dist/src/main.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3005/health > /dev/null 2>&1; then
              echo "API gateway is ready"
              break
            fi
            echo "Waiting for API gateway... ($i/30)"
            sleep 2
          done
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "aagam-ci-only-jwt-secret-change-me-in-production"
          NODE_ENV: test
          PORT: "3005"
          PLAYWRIGHT_QA: "true"
          PLAYWRIGHT_QA_SEED: "true"
          CORS_ORIGINS: "http://localhost:3001"

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=list --workers="$PLAYWRIGHT_WORKERS" --shard="${{ matrix.shard }}/2"
        working-directory: apps/admin-dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3005
          ADMIN_EMAIL: ${{ env.CI_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          CUSTOMER_EMAIL: ${{ env.CI_CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          STORE_EMAIL: ${{ env.CI_STORE_EMAIL }}
          STORE_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          RIDER_EMAIL: ${{ env.CI_RIDER_EMAIL }}
          RIDER_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          QA_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ env.CI_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          STORE_OWNER_QA_EMAIL: ${{ env.CI_STORE_EMAIL }}
          STORE_OWNER_QA_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          P4_DEMO_PASS: ${{ env.CI_TEST_PASSWORD }}
          P4_ADMIN_PASS: ${{ env.CI_TEST_PASSWORD }}
          P4_STORE_PASS: ${{ env.CI_TEST_PASSWORD }}
          P4_RIDER_PASS: ${{ env.CI_TEST_PASSWORD }}
          P5_CUSTOMER_PASS: ${{ env.CI_TEST_PASSWORD }}
          P5_ADMIN_PASS: ${{ env.CI_TEST_PASSWORD }}
          P5_STORE_PASS: ${{ env.CI_TEST_PASSWORD }}
          P5_RIDER_PASS: ${{ env.CI_TEST_PASSWORD }}
          P6_DEMO_PASS: ${{ env.CI_TEST_PASSWORD }}
          DISPATCH_TEST_PASS: ${{ env.CI_TEST_PASSWORD }}
          DISPATCH_STORE_PASS: ${{ env.CI_TEST_PASSWORD }}
          DISPATCH_RIDER_PASS: ${{ env.CI_TEST_PASSWORD }}
          NOTIF_ADMIN_PASS: ${{ env.CI_TEST_PASSWORD }}
          NOTIF_CUSTOMER_PASS: ${{ env.CI_TEST_PASSWORD }}
          NOTIF_STORE_PASS: ${{ env.CI_TEST_PASSWORD }}
          NOTIF_RIDER_PASS: ${{ env.CI_TEST_PASSWORD }}
          NOTIF_FALLBACK_PASS: ${{ env.CI_TEST_PASSWORD }}
          LOGIN_TEST_ADMIN_EMAIL: ${{ env.CI_ADMIN_EMAIL }}
          LOGIN_TEST_ADMIN_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          LOGIN_TEST_CUSTOMER_EMAIL: ${{ env.CI_CUSTOMER_EMAIL }}
          LOGIN_TEST_CUSTOMER_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          LOGIN_TEST_RIDER_EMAIL: ${{ env.CI_RIDER_EMAIL }}
          LOGIN_TEST_RIDER_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          LOGIN_TEST_STORE_EMAIL: ${{ env.CI_STORE_EMAIL }}
          LOGIN_TEST_STORE_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          SMOKE_TEST_EMAIL: ${{ env.CI_CUSTOMER_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ env.CI_TEST_PASSWORD }}
          SETUP_STORE_PASS: ${{ env.CI_TEST_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/admin-dashboard/playwright-report/
          retention-days: 14

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-shard-${{ matrix.shard }}
          path: docs/qa/phase-4/
          retention-days: 14
