name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-agent-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Apply verified production completion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify, apply, clean transport, and commit
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .github/agent-final.part00 \
            .github/agent-final.part01 \
            .github/agent-final.part02 \
            .github/agent-final.part03x0 \
            .github/agent-final.part03x1 \
            .github/agent-final.part03x2 \
            .github/agent-final.part03x3 \
            .github/agent-final.part04 \
            .github/agent-final.part05 \
            .github/agent-final.part06 \
            .github/agent-final.part07 \
            > /tmp/final.patch.gz.b64

          base64 -d /tmp/final.patch.gz.b64 > /tmp/final.patch.gz
          echo "748b7db05b8a3c09d19e2ce6bbc23cb2ab786dfb9e9fd4fa37645f758c10ec57  /tmp/final.patch.gz" | sha256sum -c -

          gzip -dc /tmp/final.patch.gz > /tmp/final.patch
          echo "996a2bfa4e49ada582ca6a90596c3995311b3408acb68e8908a87c27475e3282  /tmp/final.patch" | sha256sum -c -

          git apply --check /tmp/final.patch
          git apply /tmp/final.patch

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml

          rm -f .github/agent-production.patch.gz
          rm -f .github/workflows/agent-source-export.yml
          rm -f .github/workflows/agent-final-apply.yml
          rm -f .github/agent-final.part{00..07}
          rm -f .github/agent-final.part03x{0..3}

          git diff --check
          git config user.name "AAGAM Production Completion Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f docs/ai-runs/2026-08-07-subscription-production-completion.md
          git diff --cached --check
          git status --short
          git commit -m "feat(subscriptions): complete production hardening and regional delivery"
          git push origin HEAD:agent/subscription-production-completion
