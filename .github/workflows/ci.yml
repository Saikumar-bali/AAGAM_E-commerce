name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_build"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: npx turbo build --cache-dir=".turbo" --force

  test:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"
      NODE_ENV: test
      JWT_SECRET: "ci-test-secret-minimum-32-characters-long"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Build workspace packages for tests
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Apply all migrations to test database
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Verify migration status
        run: npx prisma migrate status --schema packages/database/prisma/schema.prisma

      - name: Run CI-safe tests
        run: npm run test:ci --workspace=apps/api-gateway

  playwright:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase-')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test
      JWT_SECRET: "ci-test-secret-minimum-32-characters-long"
      PLAYWRIGHT_QA: "true"
      PLAYWRIGHT_QA_SEED: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Build workspace packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/admin-dashboard

      - name: Build API gateway and dashboard
        run: |
          npx turbo build --filter=@aagam/api-gateway --filter=@aagam/admin-dashboard --cache-dir=".turbo" --force

      - name: Start API gateway
        run: |
          node apps/api-gateway/dist/src/main.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3005/health > /dev/null 2>&1; then
              echo "API gateway is ready"
              break
            fi
            echo "Waiting for API gateway... ($i/30)"
            sleep 2
          done
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-secret-minimum-32-characters-long"
          NODE_ENV: test
          PORT: "3005"
          PLAYWRIGHT_QA: "true"
          PLAYWRIGHT_QA_SEED: "true"
          CORS_ORIGINS: "http://localhost:3001"

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=list
        working-directory: apps/admin-dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3005
          ADMIN_EMAIL: "admin@aagam.com"
          ADMIN_PASSWORD: "admin@2026!"
          QA_PASSWORD: "Test@1234"
          SEED_ADMIN_EMAIL: "admin@aagam.com"
          SEED_ADMIN_PASSWORD: "Admin@123"
          STORE_OWNER_QA_EMAIL: "store-owner-qa@aagam.com"
          STORE_OWNER_QA_PASSWORD: "Store@123"
          P4_DEMO_PASS: "Demo@123"
          P4_ADMIN_PASS: "Admin@123"
          P5_DEMO_PASS: "Demo@123"
          P5_ADMIN_PASS: "Admin@123"
          P6_DEMO_PASS: "Demo@123"
          DISPATCH_TEST_PASS: "Test@1234"
          NOTIF_ADMIN_PASS: "admin@2026!"
          NOTIF_CUSTOMER_PASS: "customer@2026!"
          NOTIF_STORE_PASS: "store@2026!"
          NOTIF_RIDER_PASS: "rider@2026!"
          NOTIF_FALLBACK_PASS: "Test@1234"
          LOGIN_TEST_ADMIN_EMAIL: "admin@aagam.com"
          LOGIN_TEST_ADMIN_PASSWORD: "TestPass123!"
          LOGIN_TEST_CUSTOMER_EMAIL: "customer@aagam.com"
          LOGIN_TEST_CUSTOMER_PASSWORD: "TestPass123!"
          LOGIN_TEST_RIDER_EMAIL: "rider1@aagam.com"
          LOGIN_TEST_RIDER_PASSWORD: "TestPass123!"
          LOGIN_TEST_STORE_EMAIL: "store@aagam.com"
          LOGIN_TEST_STORE_PASSWORD: "TestPass123!"
          SMOKE_TEST_EMAIL: "customer@aagam.com"
          SMOKE_TEST_PASSWORD: "customer123"
          SETUP_STORE_PASS: "Store@123"
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin-dashboard/playwright-report/
          retention-days: 14

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: docs/qa/phase-4/
          retention-days: 14
