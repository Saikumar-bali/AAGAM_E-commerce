name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-agent-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Diagnose verified transport chunks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show exact chunk identities
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/agent-final.part{00..07}
          sha256sum .github/agent-final.part{00..07}
          echo "Expected:"
          cat <<'EOF'
          a8e31d16f80273edc7673d4c0a130f6290e896124cb96681f8d67e901b27fc24  .github/agent-final.part00
          5d73f35db480ac95b1bec5be7706cf33f4b7c84ced2f7ff08320de1fcbbadc62  .github/agent-final.part01
          91f49da89608ddd08bb9762d6620cca42676fb6a33e68c1b11a7409edd08bfdd  .github/agent-final.part02
          67a6da9dabdcb3a20004c40ff0cf5ae0ec311e24d81ae62115c2649b3efecf3f  .github/agent-final.part03
          1e11d2e77d4762577f09c8a939803f2bba8a12465da3f959b19f8431084a127e  .github/agent-final.part04
          fbfb0aff5e978d60f787aba0f1440ec09cc4829471d331e7e341eabc92b9ce6c  .github/agent-final.part05
          de35b232cdb9ac1222c0911af9066e1223eb018680aa95fb603d6066b1e8324a  .github/agent-final.part06
          7ffbfaabc6c15b5831a5ccc626b3aaeb757ff9d70d43b68eef9bc4698e180130  .github/agent-final.part07
          EOF
