name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npx turbo build --cache-dir=".turbo" --force 2>&1 | tee build-output.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 1

  test:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_ecom_test"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Build workspace packages for tests
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Apply all migrations to test database
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Verify migration status
        run: npx prisma migrate status --schema packages/database/prisma/schema.prisma

      - name: Run CI-safe tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci --workspace=apps/api-gateway 2>&1 | tee test-output.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 1

  mobile-tests:
    name: Partners Mobile Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Reject obsolete mobile application and rider APIs
        shell: bash
        run: |
          test ! -d apps/mobile-app
          if grep -R -n -E '/orders/rider/queue|/orders/assign|joinRidersQueue|joinRiderZone|newOrderNearby' apps/mobile-partners/src; then
            echo "Obsolete public rider queue or self-assignment path found"
            exit 1
          fi

      - name: Shared mobile TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run build --workspace=@aagam/mobile-shared 2>&1 | tee mobile-shared-typecheck.log

      - name: Partners TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run build --workspace=AagamPartners 2>&1 | tee partners-typecheck.log

      - name: Focused Partners tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:phase2b --workspace=AagamPartners 2>&1 | tee mobile-test-output.log

      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-diagnostics-${{ github.run_id }}
          path: |
            mobile-shared-typecheck.log
            partners-typecheck.log
            mobile-test-output.log
          if-no-files-found: ignore
          retention-days: 1

  android-build:
    name: Partners Android Debug Build
    runs-on: ubuntu-latest
    needs: mobile-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Build Partners debug APK
        working-directory: apps/mobile-partners/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aagam-partners-debug-${{ github.run_id }}
          path: apps/mobile-partners/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
