name: Apply Store Assortment Ledger Fix

on:
  push:
    branches:
      - phase/store-assortment-inventory-ownership
    paths:
      - .github/workflows/apply-store-assortment-ledger-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/store-assortment-inventory-ownership
          fetch-depth: 0
      - name: Restore adjustment endpoint ledger semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api-gateway/src/stores/store.service.ts')
          text = path.read_text()
          old = '''          reason: existing ? 'MANUAL_ADJUSTMENT' : 'OPENING_STOCK',
          quantityDelta: quantity - previousQuantity,
          previousQuantity,
          newQuantity: quantity,
          actorUserId: actor?.id ?? null,
          note: existing
            ? `Manual adjustment: ${previousQuantity} -> ${quantity}`
            : `Product added to store assortment with ${quantity} opening units`,'''
          new = '''          reason: 'MANUAL_ADJUSTMENT',
          quantityDelta: quantity - previousQuantity,
          previousQuantity,
          newQuantity: quantity,
          actorUserId: actor?.id ?? null,
          note: `Manual adjustment: ${previousQuantity} -> ${quantity}`,'''
          if old not in text:
              raise SystemExit('Expected inventory adjustment ledger block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit ledger fix
        run: |
          git config user.name "Aagam CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api-gateway/src/stores/store.service.ts
          git commit -m "fix: preserve manual inventory adjustment ledger contract"
          git push origin HEAD:phase/store-assortment-inventory-ownership
