name: Regional routing schema bootstrap

on:
  push:
    branches:
      - feature/regional-multi-rider-route-splitting
    paths:
      - .github/workflows/regional-routing-schema-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regional-multi-rider-route-splitting
          fetch-depth: 0
      - name: Apply guarded Prisma schema patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''  cashDepositAudits CashDepositAuditEntry[] @relation("CashDepositAuditActor")
          }''',
          '''  cashDepositAudits CashDepositAuditEntry[] @relation("CashDepositAuditActor")
            deliveryRunAudits DeliveryRunAuditEntry[]
            deliveryRouteEvents DeliveryRouteEvent[]
          }''',
          'User route relations')

          replace_once(
          '''  cashDepositBatches CashDepositBatch[]
          }''',
          '''  cashDepositBatches CashDepositBatch[]
            deliveryZoneLinks DeliveryZoneStore[]
          }''',
          'Store zone links')

          replace_once(
          '''model DeliveryZone {
            id        String   @id @default(cuid())
            name      String   @unique
            isActive  Boolean  @default(true)
            sortOrder Int      @default(0)
            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt
            subscriptionPlanLinks SubscriptionPlanZone[]

            @@index([isActive, sortOrder])
          }''',
          '''model DeliveryZone {
            id                               String   @id @default(cuid())
            name                             String   @unique
            code                             String   @unique
            description                      String?
            isActive                         Boolean  @default(true)
            sortOrder                        Int      @default(0)
            priority                         Int      @default(0)
            polygon                          Json?
            centerLatitude                   Float?
            centerLongitude                  Float?
            fallbackRadiusKm                 Float?
            deliverySlots                    Json?
            maximumDailySubscriptionCapacity Int      @default(200)
            maximumStopsPerRun               Int      @default(15)
            maximumRouteDistanceKm           Float    @default(30)
            maximumEstimatedDurationMinutes  Int      @default(120)
            maximumParcelCount               Int      @default(50)
            maximumWeightKg                  Float?
            cashRiskLimitPaise               Int      @default(1000000)
            slotEndBufferMinutes             Int      @default(15)
            allowedVehicleTypes              String[] @default([])
            neighbouringZoneIds              String[] @default([])
            createdAt                        DateTime @default(now())
            updatedAt                        DateTime @updatedAt

            subscriptionPlanLinks SubscriptionPlanZone[]
            storeLinks            DeliveryZoneStore[]
            preferredRiderLinks   DeliveryZonePreferredRider[]
            customerAddresses     CustomerAddress[]
            customerSubscriptions CustomerSubscription[]
            subscriptionDeliveries SubscriptionDelivery[]
            orders                Order[]
            deliveryRuns          DeliveryRun[]
            deliveryRunStops      DeliveryRunStop[]
            homeRiders            RiderProfile[]

            @@index([isActive, priority, sortOrder])
          }''',
          'DeliveryZone model')

          replace_once(
          '''  deliveryLat      Float?
            deliveryLng      Float?
            idempotencyKey''',
          '''  deliveryLat      Float?
            deliveryLng      Float?
            deliveryZoneId   String?
            deliveryZoneSnapshot Json?
            idempotencyKey''',
          'Order zone fields')

          replace_once(
          '''  subscriptionDelivery SubscriptionDelivery? @relation("OrderSubscriptionDelivery", fields: [subscriptionDeliveryId], references: [id], onDelete: SetNull)

            @@index([orderSource, scheduledDeliveryDate])''',
          '''  subscriptionDelivery SubscriptionDelivery? @relation("OrderSubscriptionDelivery", fields: [subscriptionDeliveryId], references: [id], onDelete: SetNull)
            deliveryZone DeliveryZone? @relation(fields: [deliveryZoneId], references: [id], onDelete: SetNull)

            @@index([orderSource, scheduledDeliveryDate])
            @@index([deliveryZoneId, scheduledDeliveryDate])''',
          'Order zone relation')

          replace_once(
          '''  status                   RiderStatus                 @default(OFFLINE)
            latitude                 Float?
            longitude                Float?
            orders''',
          '''  status                   RiderStatus                 @default(OFFLINE)
            latitude                 Float?
            longitude                Float?
            homeZoneId               String?
            maximumParcelCapacity    Int                         @default(15)
            maximumCashHoldingPaise  Int                         @default(1000000)
            orders''',
          'Rider route fields')

          replace_once(
          '''  cashDepositBatches       CashDepositBatch[]
            updatedAt''',
          '''  cashDepositBatches       CashDepositBatch[]
            homeZone                  DeliveryZone?               @relation(fields: [homeZoneId], references: [id], onDelete: SetNull)
            preferredZoneLinks        DeliveryZonePreferredRider[]
            updatedAt''',
          'Rider zone relations')

          replace_once(
          '''  instructions       String?
            isDefault          Boolean  @default(false)
            createdAt          DateTime @default(now())
            updatedAt          DateTime @updatedAt
            subscriptions      CustomerSubscription[]
          }''',
          '''  instructions       String?
            isDefault          Boolean  @default(false)
            deliveryZoneId     String?
            zoneResolvedAt     DateTime?
            zoneResolutionSource DeliveryZoneResolutionSource?
            zoneResolutionConfidence Float?
            createdAt          DateTime @default(now())
            updatedAt          DateTime @updatedAt
            subscriptions      CustomerSubscription[]
            deliveryZone       DeliveryZone? @relation(fields: [deliveryZoneId], references: [id], onDelete: SetNull)

            @@index([deliveryZoneId])
          }''',
          'CustomerAddress zone fields')

          replace_once(
          '''enum DeliveryRunStatus {
            PLANNED
            READY_FOR_PICKUP''',
          '''enum DeliveryRunStatus {
            PLANNED
            RIDER_NEEDED
            READY_FOR_PICKUP''',
          'DeliveryRunStatus rider needed')

          replace_once(
          '''  AWAITING_SETTLEMENT
            COMPLETED
            CANCELLED
          }''',
          '''  AWAITING_SETTLEMENT
            INTERRUPTED
            RECOVERY_REQUIRED
            COMPLETED
            CANCELLED
          }''',
          'DeliveryRunStatus recovery values')

          replace_once(
          '''enum CashDepositBatchStatus {''',
          '''enum DeliveryZoneResolutionSource {
            POLYGON
            RADIUS
            MANUAL
            UNRESOLVED
          }

          enum RouteAssignmentSource {
            AUTOMATIC
            MANUAL
            RECOVERY
          }

          enum DeliveryRouteEventType {
            DELIVERY_REGION_RESOLVED
            ROUTE_CLUSTER_CREATED
            DELIVERY_RUN_SPLIT
            DELIVERY_RUN_MERGED
            DELIVERY_RUN_ASSIGNED
            DELIVERY_RUN_REASSIGNED
            DELIVERY_RUN_CAPACITY_WARNING
            DELIVERY_RUN_CASH_LIMIT_WARNING
            DELIVERY_RUN_INTERRUPTED
            RECOVERY_RUN_CREATED
            RUN_STOP_MOVED
            RUN_STOP_REORDERED
            DELIVERY_RUN_CANCELLED
          }

          enum CashDepositBatchStatus {''',
          'Regional enums')

          replace_once(
          '''  homeStoreId                String?
            status                     CustomerSubscriptionStatus''',
          '''  homeStoreId                String?
            deliveryZoneId             String?
            status                     CustomerSubscriptionStatus''',
          'CustomerSubscription zone field')

          replace_once(
          '''  homeStore                  Store?                     @relation(fields: [homeStoreId], references: [id], onDelete: SetNull)
            cancelledBy''',
          '''  homeStore                  Store?                     @relation(fields: [homeStoreId], references: [id], onDelete: SetNull)
            deliveryZone               DeliveryZone?              @relation(fields: [deliveryZoneId], references: [id], onDelete: SetNull)
            cancelledBy''',
          'CustomerSubscription zone relation')

          replace_once(
          '''  @@index([homeStoreId, status])
          }''',
          '''  @@index([homeStoreId, status])
            @@index([deliveryZoneId, status])
          }''',
          'CustomerSubscription zone index')

          replace_once(
          '''  deliveryJobId          String?                    @unique
            storeId                String?
            cashDuePaise''',
          '''  deliveryJobId          String?                    @unique
            storeId                String?
            deliveryZoneId         String?
            cashDuePaise''',
          'SubscriptionDelivery zone field')

          replace_once(
          '''  store                  Store?                     @relation(fields: [storeId], references: [id], onDelete: SetNull)
            runStop''',
          '''  store                  Store?                     @relation(fields: [storeId], references: [id], onDelete: SetNull)
            deliveryZone           DeliveryZone?              @relation(fields: [deliveryZoneId], references: [id], onDelete: SetNull)
            runStop''',
          'SubscriptionDelivery zone relation')

          replace_once(
          '''  @@index([storeId, serviceDate])
          }''',
          '''  @@index([storeId, serviceDate])
            @@index([deliveryZoneId, serviceDate, status])
          }''',
          'SubscriptionDelivery zone index')

          old_run = '''model DeliveryRun {
            id                     String            @id @default(cuid())
            routeCode              String            @unique
            storeId                String
            riderId                String?
            serviceDate            DateTime
            slotStart              DateTime
            slotEnd                DateTime
            deliveryCluster        String
            status                 DeliveryRunStatus @default(PLANNED)
            totalStopCount         Int               @default(0)
            completedStopCount     Int               @default(0)
            failedStopCount        Int               @default(0)
            retryPendingStopCount  Int               @default(0)
            expectedCashPaise      Int               @default(0)
            collectedCashPaise     Int               @default(0)
            depositedCashPaise     Int               @default(0)
            varianceCashPaise      Int               @default(0)
            expectedParcelCount    Int               @default(0)
            expectedItemCount      Int               @default(0)
            expectedBagCount       Int               @default(0)
            packedBagCount         Int               @default(0)
            crateCode              String?           @unique
            packingConfirmedAt     DateTime?
            packingConfirmedById   String?
            storeHandoffConfirmedAt DateTime?
            storeHandoffConfirmedById String?
            pickupConfirmedAt      DateTime?
            pickupConfirmedById    String?
            startedAt              DateTime?
            completedAt            DateTime?
            version                Int               @default(0)
            store                  Store             @relation(fields: [storeId], references: [id], onDelete: Restrict)
            rider                  RiderProfile?     @relation(fields: [riderId], references: [id], onDelete: SetNull)
            createdAt              DateTime          @default(now())
            updatedAt              DateTime          @updatedAt

            stops        DeliveryRunStop[]
            depositBatch CashDepositBatch?

            @@unique([storeId, serviceDate, slotStart, deliveryCluster])
            @@index([riderId, serviceDate, status])
            @@index([storeId, serviceDate, status])
          }'''
          new_run = '''model DeliveryRun {
            id                       String                @id @default(cuid())
            routeCode                String                @unique
            storeId                  String
            riderId                  String?
            deliveryZoneId           String?
            serviceDate              DateTime
            slotStart                DateTime
            slotEnd                  DateTime
            deliveryCluster          String
            status                   DeliveryRunStatus     @default(PLANNED)
            totalStopCount           Int                   @default(0)
            completedStopCount       Int                   @default(0)
            failedStopCount          Int                   @default(0)
            retryPendingStopCount    Int                   @default(0)
            expectedCashPaise        Int                   @default(0)
            collectedCashPaise       Int                   @default(0)
            depositedCashPaise       Int                   @default(0)
            varianceCashPaise        Int                   @default(0)
            expectedParcelCount      Int                   @default(0)
            expectedItemCount        Int                   @default(0)
            expectedBagCount         Int                   @default(0)
            packedBagCount           Int                   @default(0)
            crateCode                String?               @unique
            packingConfirmedAt       DateTime?
            packingConfirmedById     String?
            storeHandoffConfirmedAt  DateTime?
            storeHandoffConfirmedById String?
            pickupConfirmedAt        DateTime?
            pickupConfirmedById      String?
            startedAt                DateTime?
            completedAt              DateTime?
            planningAlgorithmVersion String                @default("regional-nearest-neighbour-v1")
            plannedAt                DateTime?
            originalStopCount        Int                   @default(0)
            estimatedDistanceKm      Float                 @default(0)
            estimatedDurationMinutes Int                   @default(0)
            clusterIdentifier        String?
            manualOverride           Boolean               @default(false)
            manualOverrideReason     String?
            assignmentScoreVersion   String?
            assignmentReasonSummary String?
            assignmentConstraints    Json?
            assignmentSource         RouteAssignmentSource?
            recoveryFromRunId        String?
            interruptedAt            DateTime?
            interruptionReason       String?
            version                  Int                   @default(0)
            store                    Store                 @relation(fields: [storeId], references: [id], onDelete: Restrict)
            rider                    RiderProfile?         @relation(fields: [riderId], references: [id], onDelete: SetNull)
            deliveryZone             DeliveryZone?         @relation(fields: [deliveryZoneId], references: [id], onDelete: SetNull)
            recoveryFromRun          DeliveryRun?          @relation("RecoveryRuns", fields: [recoveryFromRunId], references: [id], onDelete: SetNull)
            recoveryRuns             DeliveryRun[]         @relation("RecoveryRuns")
            createdAt                DateTime              @default(now())
            updatedAt                DateTime              @updatedAt

            stops                   DeliveryRunStop[]
            movedStops              DeliveryRunStop[]      @relation("MovedFromRun")
            depositBatch            CashDepositBatch?
            audits                  DeliveryRunAuditEntry[] @relation("DeliveryRunAudits")
            auditSourceEntries      DeliveryRunAuditEntry[] @relation("DeliveryRunAuditSource")
            auditDestinationEntries DeliveryRunAuditEntry[] @relation("DeliveryRunAuditDestination")
            routeEvents             DeliveryRouteEvent[]

            @@unique([storeId, serviceDate, slotStart, deliveryCluster])
            @@index([riderId, serviceDate, status])
            @@index([storeId, serviceDate, status])
            @@index([deliveryZoneId, serviceDate, status])
            @@index([clusterIdentifier, serviceDate])
          }'''
          replace_once(old_run, new_run, 'DeliveryRun model')

          old_stop = '''model DeliveryRunStop {
            id                     String                @id @default(cuid())
            deliveryRunId          String
            deliveryJobId          String                @unique
            subscriptionDeliveryId String                @unique
            sequenceNumber         Int
            status                 DeliveryRunStopStatus @default(PLANNED)
            proofMode              SubscriptionProofMode
            cashDuePaise           Int                   @default(0)
            expectedItemCount      Int
            expectedParcelCount    Int                   @default(1)
            arrivedAt              DateTime?
            deliveredAt            DateTime?
            failedAt               DateTime?
            retryCount             Int                   @default(0)
            latitude               Float?
            longitude              Float?
            accuracyMetres         Float?
            proofReference         String?
            failureReason          String?
            routeOrderChangeReason String?
            version                Int                   @default(0)
            deliveryRun            DeliveryRun           @relation(fields: [deliveryRunId], references: [id], onDelete: Cascade)
            deliveryJob            DeliveryJob           @relation(fields: [deliveryJobId], references: [id], onDelete: Restrict)
            subscriptionDelivery   SubscriptionDelivery  @relation(fields: [subscriptionDeliveryId], references: [id], onDelete: Restrict)
            createdAt              DateTime               @default(now())
            updatedAt              DateTime               @updatedAt

            @@unique([deliveryRunId, sequenceNumber])
            @@index([deliveryRunId, status])
          }'''
          new_stop = '''model DeliveryRunStop {
            id                     String                @id @default(cuid())
            deliveryRunId          String
            deliveryJobId          String                @unique
            subscriptionDeliveryId String                @unique
            deliveryZoneId         String?
            sequenceNumber         Int
            status                 DeliveryRunStopStatus @default(PLANNED)
            proofMode              SubscriptionProofMode
            cashDuePaise           Int                   @default(0)
            expectedItemCount      Int
            expectedParcelCount    Int                   @default(1)
            deliveryLatitude       Float?
            deliveryLongitude      Float?
            arrivedAt              DateTime?
            deliveredAt            DateTime?
            failedAt               DateTime?
            retryCount             Int                   @default(0)
            latitude               Float?
            longitude              Float?
            accuracyMetres         Float?
            proofReference         String?
            failureReason          String?
            routeOrderChangeReason String?
            movedFromRunId         String?
            lastMovedAt            DateTime?
            version                Int                   @default(0)
            deliveryRun            DeliveryRun           @relation(fields: [deliveryRunId], references: [id], onDelete: Cascade)
            deliveryJob            DeliveryJob           @relation(fields: [deliveryJobId], references: [id], onDelete: Restrict)
            subscriptionDelivery   SubscriptionDelivery  @relation(fields: [subscriptionDeliveryId], references: [id], onDelete: Restrict)
            deliveryZone           DeliveryZone?         @relation(fields: [deliveryZoneId], references: [id], onDelete: SetNull)
            movedFromRun           DeliveryRun?          @relation("MovedFromRun", fields: [movedFromRunId], references: [id], onDelete: SetNull)
            routeEvents            DeliveryRouteEvent[]
            createdAt              DateTime              @default(now())
            updatedAt              DateTime              @updatedAt

            @@unique([deliveryRunId, sequenceNumber])
            @@index([deliveryRunId, status])
            @@index([deliveryZoneId, status])
          }'''
          replace_once(old_stop, new_stop, 'DeliveryRunStop model')

          replace_once(
          '''model CashDepositBatch {''',
          '''model DeliveryZoneStore {
            zoneId    String
            storeId   String
            priority  Int          @default(0)
            createdAt DateTime     @default(now())
            zone      DeliveryZone @relation(fields: [zoneId], references: [id], onDelete: Cascade)
            store     Store        @relation(fields: [storeId], references: [id], onDelete: Cascade)

            @@id([zoneId, storeId])
            @@index([storeId])
          }

          model DeliveryZonePreferredRider {
            zoneId          String
            riderProfileId  String
            priority        Int          @default(0)
            createdAt       DateTime     @default(now())
            zone            DeliveryZone @relation(fields: [zoneId], references: [id], onDelete: Cascade)
            riderProfile    RiderProfile @relation(fields: [riderProfileId], references: [id], onDelete: Cascade)

            @@id([zoneId, riderProfileId])
            @@index([riderProfileId])
          }

          model DeliveryRunAuditEntry {
            id               String      @id @default(cuid())
            deliveryRunId    String?
            actorUserId      String?
            actorRole        Role?
            action           String
            reason           String
            sourceRunId      String?
            destinationRunId String?
            metadata         Json?
            idempotencyKey   String      @unique
            deliveryRun      DeliveryRun? @relation("DeliveryRunAudits", fields: [deliveryRunId], references: [id], onDelete: SetNull)
            sourceRun        DeliveryRun? @relation("DeliveryRunAuditSource", fields: [sourceRunId], references: [id], onDelete: SetNull)
            destinationRun   DeliveryRun? @relation("DeliveryRunAuditDestination", fields: [destinationRunId], references: [id], onDelete: SetNull)
            actor            User?        @relation(fields: [actorUserId], references: [id], onDelete: SetNull)
            createdAt        DateTime     @default(now())

            @@index([deliveryRunId, createdAt])
          }

          model DeliveryRouteEvent {
            id                String                 @id @default(cuid())
            eventType         DeliveryRouteEventType
            deliveryRunId     String?
            deliveryRunStopId String?
            actorUserId       String?
            payload           Json
            dedupeKey         String                 @unique
            deliveryRun       DeliveryRun?           @relation(fields: [deliveryRunId], references: [id], onDelete: SetNull)
            deliveryRunStop   DeliveryRunStop?       @relation(fields: [deliveryRunStopId], references: [id], onDelete: SetNull)
            actor             User?                  @relation(fields: [actorUserId], references: [id], onDelete: SetNull)
            createdAt         DateTime               @default(now())

            @@index([deliveryRunId, createdAt])
            @@index([eventType, createdAt])
          }

          model CashDepositBatch {''',
          'Regional relation models')

          path.write_text(text)
          PY
          rm .github/workflows/regional-routing-schema-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma .github/workflows/regional-routing-schema-bootstrap.yml
          git commit -m "feat(routing): extend Prisma schema for regional route planning"
          git push origin HEAD:feature/regional-multi-rider-route-splitting
