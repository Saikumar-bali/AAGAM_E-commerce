name: Verify exact main production deployment 961e6cb

on:
  push:
    branches:
      - ops/verify-main-deploy-961e6cb

permissions:
  actions: read
  contents: write

jobs:
  verify:
    name: Verify main CI and production deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 961e6cbbbdeb284e89e72b065187aacf7e301c94
      MARKER_PATH: docs/qa/main-production-deploy-verification-961e6cb.md
      WORKFLOW_PATH: .github/workflows/verify-main-production-961e6cb.yml
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ops/verify-main-deploy-961e6cb
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Wait for exact main CI and deployment
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail

          repository="${GITHUB_REPOSITORY}"
          ci_run_id=""
          ci_conclusion=""
          deploy_run_id=""
          deploy_conclusion=""

          latest_run() {
            local workflow_name="$1"
            local event_name="$2"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${repository}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
              --jq ".workflow_runs | map(select(.name == \"${workflow_name}\" and .event == \"${event_name}\" and .head_sha == \"${TARGET_SHA}\")) | sort_by(.created_at) | last // {} | [.id, .status, (.conclusion // \"\")] | @tsv"
          }

          for attempt in $(seq 1 240); do
            record="$(latest_run "CI" "push")"
            IFS=$'\t' read -r ci_run_id ci_status ci_conclusion <<< "$record"

            if [[ -z "$ci_run_id" || "$ci_run_id" == "null" ]]; then
              echo "Waiting for main CI run for ${TARGET_SHA} (${attempt}/240)..."
              sleep 15
              continue
            fi

            echo "Main CI run ${ci_run_id}: status=${ci_status}, conclusion=${ci_conclusion:-pending}"
            if [[ "$ci_status" != "completed" ]]; then
              sleep 15
              continue
            fi

            if [[ "$ci_conclusion" != "success" ]]; then
              break
            fi

            for deploy_attempt in $(seq 1 240); do
              deploy_record="$(latest_run "Deploy production" "workflow_run")"
              IFS=$'\t' read -r deploy_run_id deploy_status deploy_conclusion <<< "$deploy_record"

              if [[ -z "$deploy_run_id" || "$deploy_run_id" == "null" ]]; then
                echo "Waiting for Deploy production run for ${TARGET_SHA} (${deploy_attempt}/240)..."
                sleep 15
                continue
              fi

              echo "Production deployment run ${deploy_run_id}: status=${deploy_status}, conclusion=${deploy_conclusion:-pending}"
              if [[ "$deploy_status" == "completed" ]]; then
                break 2
              fi
              sleep 15
            done

            break
          done

          {
            echo "ci_run_id=${ci_run_id}"
            echo "ci_conclusion=${ci_conclusion}"
            echo "deploy_run_id=${deploy_run_id}"
            echo "deploy_conclusion=${deploy_conclusion}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish verification marker and remove one-use workflow
        if: always()
        shell: bash
        env:
          CI_RUN_ID: ${{ steps.verify.outputs.ci_run_id }}
          CI_CONCLUSION: ${{ steps.verify.outputs.ci_conclusion }}
          DEPLOY_RUN_ID: ${{ steps.verify.outputs.deploy_run_id }}
          DEPLOY_CONCLUSION: ${{ steps.verify.outputs.deploy_conclusion }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$(dirname "$MARKER_PATH")"
          cat > "$MARKER_PATH" <<EOF
          # Main production deployment verification

          - Target revision: ${TARGET_SHA}
          - Main CI run: ${CI_RUN_ID:-not-found}
          - Main CI conclusion: ${CI_CONCLUSION:-not-completed}
          - Production deploy run: ${DEPLOY_RUN_ID:-not-found}
          - Production deploy conclusion: ${DEPLOY_CONCLUSION:-not-completed}
          - Verification workflow run: ${GITHUB_RUN_ID}
          EOF

          rm -f "$WORKFLOW_PATH"
          git config user.name "Saikumar-bali"
          git config user.email "178761198+Saikumar-bali@users.noreply.github.com"
          git add -f "$MARKER_PATH" "$WORKFLOW_PATH"
          git commit -m "chore(ci): record exact production deployment result"
          git push origin HEAD:ops/verify-main-deploy-961e6cb

      - name: Require successful exact-revision deployment
        env:
          CI_CONCLUSION: ${{ steps.verify.outputs.ci_conclusion }}
          DEPLOY_CONCLUSION: ${{ steps.verify.outputs.deploy_conclusion }}
        run: |
          set -Eeuo pipefail
          [[ "$CI_CONCLUSION" == "success" ]] || {
            echo "Main CI did not succeed for ${TARGET_SHA}: ${CI_CONCLUSION:-not-completed}"
            exit 1
          }
          [[ "$DEPLOY_CONCLUSION" == "success" ]] || {
            echo "Deploy production did not succeed for ${TARGET_SHA}: ${DEPLOY_CONCLUSION:-not-completed}"
            exit 1
          }
