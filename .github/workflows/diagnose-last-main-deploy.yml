name: Diagnose latest production deploy

on:
  push:
    branches: ["ops/diagnose-last-main-deploy"]
    paths:
      - ".github/workflows/diagnose-last-main-deploy.yml"

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    name: Capture protected deploy diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ops/diagnose-last-main-deploy
          fetch-depth: 1

      - name: Capture latest failed production deployment
        id: capture
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics docs/qa

          failed_run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=failure&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"

          if [[ -z "$failed_run_id" ]]; then
            echo "No failed Deploy production run was found on main." | tee diagnostics/latest-deploy-failed.log
            exit 1
          fi

          gh run view "$failed_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,name,displayTitle,headSha,event,status,conclusion,createdAt,updatedAt,jobs \
            > diagnostics/latest-deploy-metadata.json

          if ! gh run view "$failed_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed \
            > diagnostics/latest-deploy-failed.log 2>&1; then
            echo "gh run view returned a non-zero status while downloading failed logs; retained output above." \
              >> diagnostics/latest-deploy-failed.log
          fi

          failed_sha="$(jq -r '.headSha // "unknown"' diagnostics/latest-deploy-metadata.json)"
          failed_created_at="$(jq -r '.createdAt // "unknown"' diagnostics/latest-deploy-metadata.json)"
          failed_title="$(jq -r '.displayTitle // .name // "unknown"' diagnostics/latest-deploy-metadata.json)"

          cat > docs/qa/latest-production-deploy-diagnostic-marker.md <<MARKER
          # Latest production deploy diagnostic

          - Diagnostic workflow run: ${GITHUB_RUN_ID}
          - Failed deploy run: ${failed_run_id}
          - Failed deploy commit: ${failed_sha}
          - Failed deploy title: ${failed_title}
          - Failed deploy created at: ${failed_created_at}
          - Artifact: latest-production-deploy-diagnostics
          MARKER

          echo "failed_run_id=$failed_run_id" >> "$GITHUB_OUTPUT"

      - name: Upload protected diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-production-deploy-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 1

      - name: Record diagnostic run identifiers
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/latest-production-deploy-diagnostic-marker.md
          git commit -m "chore(ci): record latest deploy diagnostic [deploy-diagnostic-result]"
          git push origin HEAD:ops/diagnose-last-main-deploy
