name: Apply production deploy recovery fix

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-last-main-deploy.yml"
      - "deploy.sh"

permissions:
  contents: write

jobs:
  apply-fix:
    name: Apply production recovery changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ops/diagnose-last-main-deploy
          fetch-depth: 1

      - name: Replace void advisory-lock queries and add regression coverage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path.cwd()
          source_root = root / 'apps' / 'api-gateway' / 'src'
          old = '$queryRaw(Prisma.sql`SELECT pg_advisory_xact_lock'
          new = '$executeRaw(Prisma.sql`SELECT pg_advisory_xact_lock'
          changed_files = []
          replacements = 0

          for path in source_root.rglob('*.ts'):
              text = path.read_text()
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new))
                  changed_files.append(path.relative_to(root).as_posix())
                  replacements += count

          if replacements == 0:
              raise SystemExit('No advisory-lock $queryRaw calls were found to replace.')

          test_path = source_root / 'production-deploy-safety.contract.spec.ts'
          test_path.write_text(dedent(r'''
              import { readFileSync, readdirSync, statSync } from 'fs';
              import { resolve } from 'path';

              const repositoryRoot = resolve(__dirname, '../../..');

              function productionSourceFiles(directory: string): string[] {
                return readdirSync(directory).flatMap((entry) => {
                  const path = resolve(directory, entry);
                  if (statSync(path).isDirectory()) return productionSourceFiles(path);
                  if (!path.endsWith('.ts') || path.endsWith('.spec.ts')) return [];
                  return [path];
                });
              }

              describe('production deployment safety', () => {
                it('keeps the low-memory VPS deployment on the supported runtime', () => {
                  const deployScript = readFileSync(resolve(repositoryRoot, 'deploy.sh'), 'utf8');
                  expect(deployScript).toContain('DEPLOY_NODE_VERSION="${DEPLOY_NODE_VERSION:-22.22.3}"');
                  expect(deployScript).toContain('ensure_node_runtime');
                  expect(deployScript).toContain('ensure_deploy_memory');
                  expect(deployScript).toContain('--concurrency=1');
                  expect(deployScript).toContain('--interpreter "$deploy_node"');
                });

                it('does not deserialize PostgreSQL advisory lock void results', () => {
                  const offenders = productionSourceFiles(resolve(repositoryRoot, 'apps/api-gateway/src'))
                    .filter((path) => /\$queryRaw(?:Unsafe)?\s*\(\s*Prisma\.sql`SELECT\s+pg_advisory_xact_lock/i.test(readFileSync(path, 'utf8')));
                  expect(offenders).toEqual([]);
                });
              });
          ''').lstrip())

          docs_path = root / 'docs' / 'DEPLOYMENT_AUTOMATION.md'
          docs = docs_path.read_text()
          needle = 'Use Node.js `22.x`, matching CI. Install PM2 once and configure it to survive reboots:'
          replacement = dedent('''
              Use Node.js `22.x`, matching CI. If the system runtime is older, `deploy.sh` downloads the pinned Node `22.22.3` archive from nodejs.org, verifies it against the official SHA-256 manifest, caches it under `~/.cache/aagam-node`, and explicitly starts PM2 applications with that runtime.

              On a small VPS, `deploy.sh` checks combined free RAM and swap before `npm ci`. When less than 1536 MB is available, it creates or reactivates `/var/tmp/aagam-deploy.swap` using passwordless `sudo`, then builds with Turbo concurrency `1`. The defaults can be adjusted with `DEPLOY_MIN_AVAILABLE_MEMORY_MB`, `DEPLOY_SWAP_MB`, `DEPLOY_SWAP_FILE`, and `DEPLOY_NODE_HEAP_MB`.

              Install PM2 once and configure it to survive reboots:
          ''').strip()
          if needle not in docs:
              raise SystemExit('Deployment documentation anchor was not found.')
          docs_path.write_text(docs.replace(needle, replacement, 1))

          print(f'Replaced {replacements} advisory-lock query call(s) across {len(changed_files)} files:')
          for path in changed_files:
              print(f'  - {path}')
          PY

      - name: Validate and publish fix
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy.sh
          if grep -R --include='*.ts' -n '\$queryRaw(Prisma.sql`SELECT pg_advisory_xact_lock' apps/api-gateway/src; then
            echo 'Unsafe advisory lock query remains.'
            exit 1
          fi
          git rm .github/workflows/diagnose-last-main-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy.sh apps/api-gateway/src
          git add -f docs/DEPLOYMENT_AUTOMATION.md
          git commit -m "fix(deploy): recover low-memory production releases"
          git push origin HEAD:ops/diagnose-last-main-deploy
