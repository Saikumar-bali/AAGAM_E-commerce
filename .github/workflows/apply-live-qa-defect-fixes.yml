name: Apply live QA defect fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.head_ref == 'fix/live-inventory-empty-state-auth-errors'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic source and regression-test patch
        run: python scripts/patch-live-qa-defects.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit patched application files
        shell: bash
        run: |
          if git diff --quiet -- apps/admin-dashboard/src/app/'(store)'/store/inventory/page.tsx apps/admin-dashboard/src/app/'(auth)'/login/page.tsx apps/admin-dashboard/e2e/live-qa-regressions.spec.ts; then
            echo "Source fixes already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin-dashboard/src/app/'(store)'/store/inventory/page.tsx
          git add apps/admin-dashboard/src/app/'(auth)'/login/page.tsx
          git add apps/admin-dashboard/e2e/live-qa-regressions.spec.ts
          git commit -m "fix: handle unassigned stores and friendly auth throttling"
          git push origin HEAD:${{ github.head_ref }}
