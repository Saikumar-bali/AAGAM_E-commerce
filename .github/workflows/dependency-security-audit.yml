name: Dependency Security Audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm integrity + high/critical audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify npm registry signatures and provenance
        shell: bash
        run: |
          set -o pipefail
          npm audit signatures 2>&1 | tee npm-signatures.log

      - name: Audit locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee npm-audit.log

      - name: Upload dependency security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: |
            npm-signatures.log
            npm-audit.log
          if-no-files-found: warn
          retention-days: 14
