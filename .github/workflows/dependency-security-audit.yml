name: Dependency Security Audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm high/critical audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Audit locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee npm-audit.log

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: npm-audit.log
          if-no-files-found: error
          retention-days: 14

  branch-lockfile-fix:
    name: Apply non-breaking lockfile fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/security-and-issue-hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Apply non-breaking audit fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only --no-audit --no-fund || true
          git diff --check
          npm ci --no-audit --no-fund

      - name: Commit only package-lock.json when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No non-breaking lockfile updates available."
            exit 0
          fi
          if [ -n "$(git diff --name-only -- . ':!package-lock.json')" ]; then
            echo "Unexpected files changed; refusing to commit."
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply non-breaking npm security lockfile fixes"
          git push origin HEAD:${{ github.head_ref }}
