name: Regional routing privacy boundary

on:
  push:
    branches:
      - feature/regional-multi-rider-route-splitting
    paths:
      - .github/workflows/regional-routing-privacy-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regional-multi-rider-route-splitting
          fetch-depth: 0
      - name: Apply guarded role privacy patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str, label: str):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/api-gateway/src/subscriptions/delivery-run-operations.service.ts',
              '''  private async rider(actor: Actor) {
                if (actor.role !== Role.RIDER) throw new ForbiddenException('Rider role is required');
                const rider = await prisma.riderProfile.findUnique({ where: { userId: actor.id } });
                if (!rider) throw new ForbiddenException('Rider profile not found');
                return rider;
              }

              private async ownedRun''',
              '''  private async rider(actor: Actor) {
                if (actor.role !== Role.RIDER) throw new ForbiddenException('Rider role is required');
                const rider = await prisma.riderProfile.findUnique({ where: { userId: actor.id } });
                if (!rider) throw new ForbiddenException('Rider profile not found');
                return rider;
              }

              private safeRiderRun<T extends Record<string, any>>(run: T) {
                const {
                  assignmentConstraints: _assignmentConstraints,
                  assignmentReasonSummary: _assignmentReasonSummary,
                  assignmentScoreVersion: _assignmentScoreVersion,
                  ...safe
                } = run;
                return safe;
              }

              private async ownedRun''',
              'safe rider run helper',
          )
          replace_once(
              'apps/api-gateway/src/subscriptions/delivery-run-operations.service.ts',
              '''    if (!run) throw new NotFoundException('Assigned delivery run not found');
                return { rider, run };
              }

              async today''',
              '''    if (!run) throw new NotFoundException('Assigned delivery run not found');
                return { rider, run: this.safeRiderRun(run) };
              }

              async today''',
              'rider detail sanitization',
          )
          replace_once(
              'apps/api-gateway/src/subscriptions/delivery-run-operations.service.ts',
              '''    return prisma.deliveryRun.findMany({
                where: { riderId: rider.id, serviceDate: { gte: day, lt: next }, status: { not: DeliveryRunStatus.CANCELLED } },
                orderBy: { slotStart: 'asc' },
                include: {
                  store: { select: { id: true, name: true, address: true, latitude: true, longitude: true } },
                  deliveryZone: true,
                  _count: { select: { stops: true } },
                },
              });''',
              '''    const runs = await prisma.deliveryRun.findMany({
                where: { riderId: rider.id, serviceDate: { gte: day, lt: next }, status: { not: DeliveryRunStatus.CANCELLED } },
                orderBy: { slotStart: 'asc' },
                include: {
                  store: { select: { id: true, name: true, address: true, latitude: true, longitude: true } },
                  deliveryZone: true,
                  _count: { select: { stops: true } },
                },
              });
              return runs.map((run) => this.safeRiderRun(run));''',
              'rider list sanitization',
          )

          replace_once(
              'apps/api-gateway/src/subscriptions/regional-route-operations.service.ts',
              '''  async events(after?: string) {
                return prisma.deliveryRouteEvent.findMany({
                  where: after ? { createdAt: { gt: new Date(after) } } : undefined,
                  orderBy: { createdAt: 'asc' },
                  take: 500,
                });
              }''',
              '''  async events(after?: string, actor?: Actor) {
                let deliveryRunWhere: Prisma.DeliveryRunWhereInput | undefined;
                if (actor?.role === Role.RIDER) {
                  const rider = await prisma.riderProfile.findUnique({ where: { userId: actor.id }, select: { id: true } });
                  if (!rider) return [];
                  deliveryRunWhere = { riderId: rider.id };
                } else if (actor?.role === Role.STORE_OWNER) {
                  const stores = await prisma.store.findMany({ where: { ownerId: actor.id }, select: { id: true } });
                  if (!stores.length) return [];
                  deliveryRunWhere = { storeId: { in: stores.map((store) => store.id) } };
                }
                const rows = await prisma.deliveryRouteEvent.findMany({
                  where: {
                    ...(after ? { createdAt: { gt: new Date(after) } } : {}),
                    ...(deliveryRunWhere ? { deliveryRun: { is: deliveryRunWhere } } : {}),
                  },
                  orderBy: { createdAt: 'asc' },
                  take: 500,
                });
                if (!actor || actor.role === Role.ADMIN) return rows;
                return rows.map((event) => ({
                  id: event.id,
                  eventType: event.eventType,
                  deliveryRunId: event.deliveryRunId,
                  deliveryRunStopId: event.deliveryRunStopId,
                  createdAt: event.createdAt,
                  payload: { message: safeRouteEventMessage(event.eventType) },
                }));
              }''',
              'role-scoped event feed',
          )
          path = Path('apps/api-gateway/src/subscriptions/regional-route-operations.service.ts')
          text = path.read_text()
          if 'function safeRouteEventMessage(' in text:
              raise SystemExit('safe event helper already exists')
          text += '''

function safeRouteEventMessage(eventType: DeliveryRouteEventType) {
  if ([DeliveryRouteEventType.DELIVERY_RUN_ASSIGNED, DeliveryRouteEventType.DELIVERY_RUN_REASSIGNED].includes(eventType)) {
    return 'Your assigned delivery route changed. Refresh before continuing.';
  }
  if ([DeliveryRouteEventType.DELIVERY_RUN_SPLIT, DeliveryRouteEventType.DELIVERY_RUN_MERGED, DeliveryRouteEventType.RUN_STOP_MOVED, DeliveryRouteEventType.RUN_STOP_REORDERED].includes(eventType)) {
    return 'The route stop list changed. Refresh to load the safe current order.';
  }
  if ([DeliveryRouteEventType.DELIVERY_RUN_INTERRUPTED, DeliveryRouteEventType.RECOVERY_RUN_CREATED].includes(eventType)) {
    return 'A recovery route update is available. Refresh the route before continuing.';
  }
  if (eventType === DeliveryRouteEventType.DELIVERY_RUN_CANCELLED) return 'This route was cancelled or replanned.';
  return 'Delivery route information was updated.';
}
'''
          path.write_text(text)

          replace_once(
              'apps/api-gateway/src/subscriptions/regional-routing.controller.ts',
              '''  @Get()
              list(@Query('after') after?: string) {
                return this.operations.events(after);
              }''',
              '''  @Get()
              list(@Query('after') after: string | undefined, @Req() request: AuthenticatedRequest) {
                return this.operations.events(after, request.user);
              }''',
              'shared event actor scope',
          )
          PY
          rm .github/workflows/regional-routing-privacy-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api-gateway/src/subscriptions/delivery-run-operations.service.ts \
            apps/api-gateway/src/subscriptions/regional-route-operations.service.ts \
            apps/api-gateway/src/subscriptions/regional-routing.controller.ts \
            .github/workflows/regional-routing-privacy-boundary.yml
          git commit -m "fix(routing): scope route updates and hide internal rider scoring"
          git push origin HEAD:feature/regional-multi-rider-route-splitting
