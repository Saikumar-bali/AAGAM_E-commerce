name: Temporary Maestro Runner Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maestro-run-diagnostics.yml"

permissions:
  actions: read
  contents: read

jobs:
  collect-failed-runner-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FAILED_JOB_ID: "88913589378"
    steps:
      - name: Download failed emulator job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            --output diagnostics/full-job.log
          tail -n 500 diagnostics/full-job.log > diagnostics/job-tail.log
          grep -Ein \
            "error|failed|failure|emulator|avd|sdkmanager|timeout|panic|kvm|qemu|exit code" \
            diagnostics/full-job.log > diagnostics/error-lines.log || true

      - name: Upload runner diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: temporary-maestro-runner-diagnostics
          path: diagnostics/**
          if-no-files-found: error
          retention-days: 2
