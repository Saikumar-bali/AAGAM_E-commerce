name: Aagaam UI Brand Audit

on:
  push:
    branches: ["agent/aagaam-production-ux-notifications"]
    paths: [".github/workflows/aagam-ui-brand-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List legacy presentation copy
        shell: bash
        run: |
          echo '=== WEB AND REACT NATIVE SOURCE ==='
          rg -n --glob '*.ts' --glob '*.tsx' 'AAGAM|Aagam' apps/admin-dashboard/src apps/mobile-customer/src apps/mobile-partners/src || true
          echo '=== ANDROID PRESENTATION SOURCE ==='
          rg -n 'AAGAM|Aagam' apps/mobile-customer/android/app/src/main apps/mobile-partners/android/app/src/main || true
