name: Unblock PR 97 Patch Runner

on:
  push:
    branches:
      - phase/store-assortment-inventory-ownership

permissions:
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/store-assortment-inventory-ownership
          fetch-depth: 0
      - name: Enable patch runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-pr97-review-fixes.yml')
          text = path.read_text()
          guard = "    if: github.actor != 'github-actions[bot]'\n"
          if guard not in text:
              raise SystemExit('Patch runner guard was not found')
          path.write_text(text.replace(guard, '', 1))
          PY
          rm -f .github/workflows/unblock-pr97-patch.yml .github/pr97-patch-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: enable PR 97 review patch runner"
          git push origin HEAD:phase/store-assortment-inventory-ownership
