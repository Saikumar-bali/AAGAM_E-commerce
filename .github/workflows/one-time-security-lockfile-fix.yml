name: One-time Security Lockfile Fix

on:
  push:
    branches:
      - agent/security-and-issue-hardening
    paths:
      - .github/workflows/one-time-security-lockfile-fix.yml

permissions:
  contents: write

jobs:
  audit-fix-lockfile:
    name: Apply non-breaking npm audit lockfile fixes
    runs-on: ubuntu-latest
    if: github.repository == 'Saikumar-bali/AAGAM_E-commerce'

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-and-issue-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Apply npm audit fixes to lockfile only
        shell: bash
        run: |
          set -o pipefail
          npm audit fix --package-lock-only --no-audit --no-fund || true
          git diff --check
          git diff -- package-lock.json

      - name: Validate resulting install
        run: npm ci --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No non-breaking lockfile fixes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply non-breaking npm security lockfile fixes"
          git push origin HEAD:agent/security-and-issue-hardening
