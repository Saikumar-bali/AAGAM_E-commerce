name: Subscription review fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/subscription-delivery-runs-cod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscription-delivery-runs-cod
          fetch-depth: 0

      - name: Apply canonical Aagaam copy fix
        env:
          TARGET_BRANCH: feature/subscription-delivery-runs-cod
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILE=apps/mobile-customer/src/screens/customer/SubscriptionDetailScreen.tsx
          grep -q "AAGAM operations" "$FILE"
          sed -i "s/AAGAM operations/Aagaam operations/" "$FILE"
          rm .github/workflows/subscription-review-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" .github/workflows/subscription-review-fix.yml
          git commit -m "fix(mobile-customer): use canonical Aagaam subscription copy"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
