name: Issue 203 Apply

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: issue-203-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic audit fixes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/issue-203-fix.py 2>&1 | tee /tmp/issue-203-apply.log

      - name: Persist patch diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "Issue #203 deterministic patch failed."
            echo
            echo "## Working tree"
            git status --short
            echo
            echo "## Patch output"
            cat /tmp/issue-203-apply.log 2>/dev/null || true
          } > issue-203-validation-failure.txt
          git add issue-203-validation-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist issue 203 patch diagnostics [issue-203-diagnostic]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Commit final source diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/issue-203-fix.py scripts/issue203-parts .github/workflows/issue-203-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mobile): resolve issue 203 audit blockers [issue-203-final]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
