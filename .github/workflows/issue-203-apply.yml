name: Issue 203 Apply

on:
  push:
    branches:
      - agent/issue-203-mobile-ui-ux-audit

permissions:
  contents: write

concurrency:
  group: issue-203-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-203-final]') && !contains(github.event.head_commit.message, '[issue-203-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-203-mobile-ui-ux-audit
          fetch-depth: 0

      - name: Apply deterministic audit fixes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/issue-203-fix.py 2>&1 | tee /tmp/issue-203-apply.log

      - name: Persist patch diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "Issue #203 deterministic patch failed."
            echo
            echo "## Working tree"
            git status --short
            echo
            echo "## Patch output"
            cat /tmp/issue-203-apply.log 2>/dev/null || true
          } > issue-203-validation-failure.log
          git add issue-203-validation-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist issue 203 patch diagnostics [issue-203-diagnostic]"
          git push origin HEAD:agent/issue-203-mobile-ui-ux-audit

      - name: Commit final source diff
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/issue-203-fix.py .github/workflows/issue-203-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mobile): resolve issue 203 audit blockers [issue-203-final]"
          git push origin HEAD:agent/issue-203-mobile-ui-ux-audit
