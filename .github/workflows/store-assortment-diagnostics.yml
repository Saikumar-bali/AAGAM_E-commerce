name: Store Assortment Diagnostics

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/api-gateway/**"
      - "apps/admin-dashboard/**"
      - "apps/mobile-partners/**"
      - ".github/workflows/store-assortment-diagnostics.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api-gateway
            command: npm run build --workspace=apps/api-gateway
          - target: admin-dashboard
            command: npm run build --workspace=apps/admin-dashboard
          - target: mobile-partners
            command: npm run build --workspace=apps/mobile-partners
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aagam_diagnostics
      NEXT_PUBLIC_API_URL: http://localhost:3005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund >/dev/null
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma >/dev/null
      - name: Build shared workspace packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json
      - name: Build selected target
        id: build
        shell: bash
        run: |
          set +e
          ${{ matrix.command }} > build-${{ matrix.target }}.log 2>&1
          status=$?
          tail -n 100 build-${{ matrix.target }}.log
          exit $status
      - name: Run Aagam Partners inventory domain tests
        if: matrix.target == 'mobile-partners'
        run: npm test --workspace=apps/mobile-partners -- src/domain/storeInventory.spec.ts
      - name: Upload isolated build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}-log
          path: build-${{ matrix.target }}.log
          if-no-files-found: error
          retention-days: 2
