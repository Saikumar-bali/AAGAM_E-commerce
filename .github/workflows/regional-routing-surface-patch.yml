name: Regional routing surface patch

on:
  push:
    branches:
      - feature/regional-multi-rider-route-splitting
    paths:
      - .github/workflows/regional-routing-surface-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regional-multi-rider-route-splitting
          fetch-depth: 0
      - name: Apply guarded parser and navigation patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str, label: str):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/admin-dashboard/src/app/(admin)/admin/route-planning/page.tsx',
              "const all = [...points, ...polygons.flatMap((item) => item.points.map((point, index) => ({ ...point, id: `${item.zone.id}-${index}`, kind: 'stop' as const, label: item.zone.name }))];",
              "const all = [...points, ...polygons.flatMap((item) => item.points.map((point, index) => ({ ...point, id: `${item.zone.id}-${index}`, kind: 'stop' as const, label: item.zone.name })))];",
              'regional map parser fix',
          )
          replace_once(
              'apps/admin-dashboard/src/components/Sidebar.tsx',
              '    { name: "Subscriptions", href: "/admin/subscriptions", icon: CalendarDays },\n    { name: "Riders", href: "/admin/riders", icon: Truck },',
              '    { name: "Subscriptions", href: "/admin/subscriptions", icon: CalendarDays },\n    { name: "Route Planning", href: "/admin/route-planning", icon: Route },\n    { name: "Riders", href: "/admin/riders", icon: Truck },',
              'admin route-planning navigation',
          )
          replace_once(
              'apps/admin-dashboard/e2e/responsive-role-navigation.spec.ts',
              "      { name: 'Subscriptions', href: '/admin/subscriptions' },\n      { name: 'Notifications', href: '/admin/notifications' },",
              "      { name: 'Subscriptions', href: '/admin/subscriptions' },\n      { name: 'Route Planning', href: '/admin/route-planning' },\n      { name: 'Notifications', href: '/admin/notifications' },",
              'responsive admin route case',
          )
          replace_once(
              'apps/admin-dashboard/e2e/responsive-role-navigation.spec.ts',
              "    await expect(desktopNavigation.locator('a')).toHaveCount(15);\n    await expect(desktopNavigation.locator('a[href=\"/admin/subscriptions\"]')).toBeVisible();",
              "    await expect(desktopNavigation.locator('a')).toHaveCount(16);\n    await expect(desktopNavigation.locator('a[href=\"/admin/subscriptions\"]')).toBeVisible();\n    await expect(desktopNavigation.locator('a[href=\"/admin/route-planning\"]')).toBeVisible();",
              'responsive admin desktop count',
          )
          PY
          rm .github/workflows/regional-routing-surface-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin-dashboard/src/app/'(admin)'/admin/route-planning/page.tsx \
            apps/admin-dashboard/src/components/Sidebar.tsx \
            apps/admin-dashboard/e2e/responsive-role-navigation.spec.ts \
            .github/workflows/regional-routing-surface-patch.yml
          git commit -m "fix(routing): correct map parser and expose admin route planning"
          git push origin HEAD:feature/regional-multi-rider-route-splitting
