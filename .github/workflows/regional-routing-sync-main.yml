name: Regional routing sync main

on:
  push:
    branches:
      - feature/regional-multi-rider-route-splitting
    paths:
      - .github/workflows/regional-routing-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regional-multi-rider-route-splitting
          fetch-depth: 0
      - name: Merge current main and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/regional-routing-sync-main.yml
          git add .github/workflows/regional-routing-sync-main.yml
          git commit --amend --no-edit
          git push origin HEAD:feature/regional-multi-rider-route-splitting
