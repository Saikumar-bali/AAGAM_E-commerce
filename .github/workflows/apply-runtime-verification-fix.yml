name: Apply PM2 runtime verification fix

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-runtime-verification-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    name: Apply direct PM2 runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/deploy-runtime-verification
          fetch-depth: 1

      - name: Replace stale PM2 metadata check
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          deploy_path = Path('deploy.sh')
          deploy = deploy_path.read_text()
          old = r'''pm2 jlist | node -e '
            const fs = require("fs");
            const expected = ["admin-dashboard", "api-gateway", "worker-service"];
            const apps = JSON.parse(fs.readFileSync(0, "utf8"));
            const byName = new Map(apps.map((app) => [app.name, app]));
            const offline = expected.filter((name) => byName.get(name)?.pm2_env?.status !== "online");
            const wrongRuntime = expected.filter((name) => {
              const version = String(byName.get(name)?.pm2_env?.node_version || "");
              return !version.startsWith("22.");
            });
            if (offline.length) {
              console.error(`PM2 processes not online: ${offline.join(", ")}`);
              process.exit(1);
            }
            if (wrongRuntime.length) {
              console.error(`PM2 processes not running on Node 22: ${wrongRuntime.join(", ")}`);
              process.exit(1);
            }
          '
          '''
          new = r'''pm2 jlist | node -e '
            const fs = require("fs");
            const expected = ["admin-dashboard", "api-gateway", "worker-service"];
            const expectedRuntime = fs.realpathSync(process.execPath);
            const apps = JSON.parse(fs.readFileSync(0, "utf8"));
            const byName = new Map(apps.map((app) => [app.name, app]));
            const offline = expected.filter((name) => byName.get(name)?.pm2_env?.status !== "online");
            const wrongRuntime = expected.flatMap((name) => {
              const pid = Number(byName.get(name)?.pid);
              if (!Number.isInteger(pid) || pid <= 0) return [`${name}: invalid PID ${pid}`];
              try {
                const actualRuntime = fs.realpathSync(`/proc/${pid}/exe`);
                return actualRuntime === expectedRuntime ? [] : [`${name}: ${actualRuntime}`];
              } catch (error) {
                return [`${name}: unable to inspect /proc/${pid}/exe (${error.message})`];
              }
            });
            if (offline.length) {
              console.error(`PM2 processes not online: ${offline.join(", ")}`);
              process.exit(1);
            }
            if (wrongRuntime.length) {
              console.error(`PM2 processes not using ${expectedRuntime}: ${wrongRuntime.join(", ")}`);
              process.exit(1);
            }
          '
          '''
          if old not in deploy:
              raise SystemExit('Expected stale PM2 runtime verification block was not found.')
          deploy_path.write_text(deploy.replace(old, new, 1))

          test_path = Path('apps/api-gateway/src/production-deploy-safety.contract.spec.ts')
          test = test_path.read_text()
          anchor = "    expect(deployScript).toContain('--interpreter \"$deploy_node\"');\n"
          replacement = anchor + "    expect(deployScript).toContain('fs.realpathSync(`/proc/${pid}/exe`)');\n    expect(deployScript).not.toContain('pm2_env?.node_version');\n"
          if anchor not in test:
              raise SystemExit('Deployment regression test anchor was not found.')
          test_path.write_text(test.replace(anchor, replacement, 1))
          PY

      - name: Validate and publish fix
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy.sh
          grep -F 'fs.realpathSync(`/proc/${pid}/exe`)' deploy.sh >/dev/null
          ! grep -F 'pm2_env?.node_version' deploy.sh >/dev/null
          git rm .github/workflows/apply-runtime-verification-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy.sh apps/api-gateway/src/production-deploy-safety.contract.spec.ts
          git commit -m "fix(deploy): verify PM2 runtime from live process"
          git push origin HEAD:fix/deploy-runtime-verification
