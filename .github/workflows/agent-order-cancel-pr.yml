name: Agent Order Cancellation PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: "22.22.3"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_order_cancel_cleanup"
  NODE_ENV: test
  DELIVERY_OTP_SECRET: "order-cancel-cleanup-ci-only-secret"
  NOTIFICATION_WORKER_DISABLED: "true"

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_order_cancel_cleanup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-order-cancel-delivery-job

      - name: Apply fix and regression test
        run: python .github/scripts/apply-order-cancel-cleanup.py

      - name: Check patch formatting
        run: git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate, generate, and migrate database
        run: |
          npx prisma validate --schema packages/database/prisma/schema.prisma
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Build shared packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Run cancellation regression tests
        run: >-
          npx jest --config apps/api-gateway/jest.config.js --runInBand --runTestsByPath
          apps/api-gateway/src/order-cancellation-delivery-job.spec.ts

      - name: Build API
        run: npm run build:api

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api-gateway/src/orders/order.service.ts \
            apps/api-gateway/src/order-cancellation-delivery-job.spec.ts
          git commit -m "fix order cancellation delivery cleanup"
          git push origin HEAD:agent/fix-order-cancel-delivery-job
