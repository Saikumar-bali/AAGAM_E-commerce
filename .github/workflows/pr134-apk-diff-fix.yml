name: Apply PR 134 APK Diff Fix

on:
  push:
    branches:
      - agent/aagaam-ui-support-account-fixes
    paths:
      - .github/workflows/pr134-apk-diff-fix.yml

permissions:
  contents: write

concurrency:
  group: pr134-apk-diff-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aagaam-ui-support-account-fixes
          fetch-depth: 0

      - name: Harden APK changed-app detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-apk-release.yml')
          text = path.read_text()
          old = '''            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            changed="$(git diff --name-only "$base" "$RELEASE_SHA")"
'''
          new = '''            base="$BEFORE_SHA"
            if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
              git fetch --no-tags origin "$GITHUB_BASE_REF"
            fi
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              if [[ -n "${GITHUB_BASE_REF:-}" ]] && git rev-parse --verify --quiet "origin/$GITHUB_BASE_REF^{commit}" >/dev/null; then
                base="$(git merge-base "$RELEASE_SHA" "origin/$GITHUB_BASE_REF")"
              else
                base="$(git rev-parse "$RELEASE_SHA^")"
              fi
            fi
            changed="$(git diff --name-only "$base" "$RELEASE_SHA")"
'''
          if old not in text:
              raise SystemExit('Expected APK detector block was not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/pr134-apk-diff-fix.yml').unlink()
          PY

      - name: Validate workflow text
        shell: bash
        run: |
          grep -Fq 'git cat-file -e "$base^{commit}"' .github/workflows/android-apk-release.yml
          grep -Fq 'git merge-base "$RELEASE_SHA" "origin/$GITHUB_BASE_REF"' .github/workflows/android-apk-release.yml
          test ! -e .github/workflows/pr134-apk-diff-fix.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add .github/workflows/android-apk-release.yml .github/workflows/pr134-apk-diff-fix.yml
          git commit -m "fix(ci): handle stale APK comparison bases"
          git push origin HEAD:agent/aagaam-ui-support-account-fixes
