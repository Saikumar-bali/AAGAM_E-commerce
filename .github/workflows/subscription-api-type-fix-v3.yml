name: Complete subscription API type correction v3

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/subscription-delivery-runs-cod'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aagam_subscription_typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscription-delivery-runs-cod
          fetch-depth: 0
      - name: Apply and compile strict API corrections
        env:
          TARGET_BRANCH: feature/subscription-delivery-runs-cod
          EXPECTED_PATCH_SHA256: 32498e8fd0f838cdf8ccd8e5b3e95edc89dd6e09e944a9f86d20e46698fe7cfc
        run: |
          set -euo pipefail
          PATCH_XZ_BASE64="$(sed -n 's/^          PATCH_XZ_BASE64: //p' .github/workflows/subscription-api-remaining-fix.yml)"
          test -n "$PATCH_XZ_BASE64"
          printf '%s' "$PATCH_XZ_BASE64" | base64 --decode > /tmp/subscription-api-remaining.patch.xz
          echo "$EXPECTED_PATCH_SHA256  /tmp/subscription-api-remaining.patch.xz" | sha256sum -c -
          xz -dc /tmp/subscription-api-remaining.patch.xz > /tmp/subscription-api-remaining.patch
          git apply --check /tmp/subscription-api-remaining.patch
          git apply --index /tmp/subscription-api-remaining.patch
          git rm .github/workflows/subscription-api-remaining-fix.yml .github/workflows/subscription-api-type-fix-v2.yml .github/workflows/subscription-api-type-fix-v3.yml

          npm ci --no-audit --no-fund
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npx prisma validate --schema packages/database/prisma/schema.prisma
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json
          npm run build --workspace @aagam/api-gateway

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(subscriptions): complete strict API typing'
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${{ github.event.pull_request.head.sha }}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
