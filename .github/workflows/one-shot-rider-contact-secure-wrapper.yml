name: One-shot Rider contact secure wrapper fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/rider-direct-contact-toast-placement' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Delegate secure Rider contact to active-job service
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          secure = Path('apps/api-gateway/src/riders/rider-portal-secure.service.ts')
          text = secure.read_text()
          old = '''  async contact(\n    userId: string,\n    deliveryJobId: string,\n    input: RiderContactDto,\n  ) {\n    if (input.channel === 'SAFETY_ESCALATION') {\n      return this.read.contact(userId, deliveryJobId, input);\n    }\n    throw new ServiceUnavailableException({\n      code: 'RIDER_CONTACT_RELAY_UNAVAILABLE',\n      message:\n        'Private calling and messaging are unavailable. Use Rider Support or Safety escalation.',\n    });\n  }'''
          new = '''  async contact(\n    userId: string,\n    deliveryJobId: string,\n    input: RiderContactDto,\n  ) {\n    // RiderPortalReadService.contact performs the current-Rider ownership check,\n    // active delivery status check, target contact resolution, and safety escalation.\n    return this.read.contact(userId, deliveryJobId, input);\n  }'''
          if old not in text:
              raise SystemExit('Expected secure contact relay block not found')
          text = text.replace(old, new, 1)
          text = text.replace('  ServiceUnavailableException,\n', '', 1)
          secure.write_text(text)

          contract = Path('apps/mobile-partners/src/rider-contact-ui.contract.spec.ts')
          text = contract.read_text()
          needle = '''    expect(source).not.toContain('RIDER_CONTACT_RELAY_NUMBER');\n  });'''
          replacement = '''    expect(source).not.toContain('RIDER_CONTACT_RELAY_NUMBER');\n    const secure = read('apps/api-gateway/src/riders/rider-portal-secure.service.ts');\n    expect(secure).toContain('return this.read.contact(userId, deliveryJobId, input);');\n    expect(secure).not.toContain('RIDER_CONTACT_RELAY_UNAVAILABLE');\n  });'''
          if needle not in text:
              raise SystemExit('Expected contact contract assertion block not found')
          contract.write_text(text.replace(needle, replacement, 1))
          PY

          git rm .github/workflows/one-shot-rider-contact-secure-wrapper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api-gateway/src/riders/rider-portal-secure.service.ts apps/mobile-partners/src/rider-contact-ui.contract.spec.ts
          git commit -m 'fix(rider): route direct contact through secure portal wrapper'
          git push origin HEAD:${{ github.head_ref }}
