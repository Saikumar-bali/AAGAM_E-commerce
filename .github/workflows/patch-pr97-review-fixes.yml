              """  const saveItem = async (item: InventoryItem, patch?: Partial<Pick<InventoryItem, 'isListed' | 'autoHideWhenOutOfStock'>>) => {
            const draft = editDrafts[item.id] || {
              quantity: String(item.quantity),
