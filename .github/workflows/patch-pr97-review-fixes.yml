          old_load = """  const loadInventory = useCallback(async (storeId: string, query = search) => {
            if (!storeId) return;
            setLoading(true);
            setMessage(null);
            try {
              const [assortmentResult, catalogueResult] = await Promise.all([
                apiClient.get(`/stores/${storeId}/assortment`),
