          )
          replace_once(screen_path, "const quantity = normalizeWholeQuantity(draft.quantity);", "const quantity = parseWholeQuantity(draft.quantity) ?? item.quantity;")
          replace_once(screen_path, "updateMutation.variables?.item.id === item.id", "updateMutation.variables?.storeId === selectedStoreId && updateMutation.variables?.item.id === item.id")
          replace_once(screen_path, "updateMutation.mutate({ item, draft })", "updateMutation.mutate({ storeId: selectedStoreId, item, draft })")
          replace_once(screen_path, "updateMutation.mutate({ item, draft, policy: { isListed: !item.isListed } })", "updateMutation.mutate({ storeId: selectedStoreId, item, draft, policy: { isListed: !item.isListed } })")
          replace_once(screen_path, "updateMutation.mutate({ item, draft, policy: { autoHideWhenOutOfStock: !item.autoHideWhenOutOfStock } })", "updateMutation.mutate({ storeId: selectedStoreId, item, draft, policy: { autoHideWhenOutOfStock: !item.autoHideWhenOutOfStock } })")
          replace_once(screen_path, "addMutation.variables?.product.id === product.id", "addMutation.variables?.storeId === selectedStoreId && addMutation.variables?.product.id === product.id")
          replace_once(screen_path, "addMutation.mutate({ product, draft })", "addMutation.mutate({ storeId: selectedStoreId, product, draft })")

          # 3. Web request sequencing and mutation-store capture.
          web_path = 'apps/admin-dashboard/src/app/(store)/store/inventory/page.tsx'
          replace_once(web_path, "import React, { useCallback, useEffect, useMemo, useState } from 'react';", "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';")
          replace_once(
              web_path,
              """const money = (paise?: number | null, fallbackRupees = 0) =>
            `₹${((paise == null ? fallbackRupees * 100 : paise) / 100).toLocaleString('en-IN', {
              minimumFractionDigits: 0,
