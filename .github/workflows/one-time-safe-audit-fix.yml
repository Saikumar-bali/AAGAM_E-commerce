# Temporary remediation workflow. Delete before merge.
# Final lock refresh after React 19 map compatibility migration.
name: One-time Safe Audit Fix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/security-and-issue-hardening
    paths:
      - .github/workflows/one-time-safe-audit-fix.yml
      - package.json
      - apps/**/package.json
      - packages/**/package.json

permissions:
  contents: write

jobs:
  audit-fix:
    if: >-
      github.repository == 'Saikumar-bali/AAGAM_E-commerce' &&
      ((github.event_name == 'pull_request' && github.head_ref == 'agent/security-and-issue-hardening') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/agent/security-and-issue-hardening'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-and-issue-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Rebuild lockfile from current workspaces and apply safe fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
          npm audit --package-lock-only --json > .security-audit-report.json || true
          git diff --check

      - name: Commit remediation outputs only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}')"
          for path in $changed; do
            case "$path" in
              package-lock.json|.security-audit-report.json) ;;
              *) echo "Unexpected changed file: $path"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .security-audit-report.json
          if git diff --cached --quiet; then
            echo 'No remediation output changed.'
            exit 0
          fi
          git commit -m 'Regenerate secure dependency lockfile'
          git push origin HEAD:agent/security-and-issue-hardening

      - name: Report remaining audit findings
        shell: bash
        run: npm audit --package-lock-only
