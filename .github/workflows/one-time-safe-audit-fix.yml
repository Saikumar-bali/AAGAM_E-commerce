name: One-time Safe Audit Fix

on:
  push:
    branches:
      - agent/security-and-issue-hardening
    paths:
      - .github/workflows/one-time-safe-audit-fix.yml

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.repository == 'Saikumar-bali/AAGAM_E-commerce' && github.ref == 'refs/heads/agent/security-and-issue-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-and-issue-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Refresh lockfile and apply non-breaking audit fixes
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
          git diff --check

      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No safe lockfile changes were available.'
            exit 0
          fi
          if [ "$changed" != "package-lock.json" ]; then
            echo 'Unexpected files changed:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Apply safe npm audit dependency updates'
          git push origin HEAD:agent/security-and-issue-hardening

      - name: Report remaining audit findings
        shell: bash
        run: npm audit --package-lock-only
