name: Subscription customer type fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/subscription-delivery-runs-cod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscription-delivery-runs-cod
          fetch-depth: 0

      - name: Apply Customer subscription TypeScript fixes
        env:
          TARGET_BRANCH: feature/subscription-delivery-runs-cod
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          detail = Path('apps/mobile-customer/src/screens/customer/SubscriptionDetailScreen.tsx')
          text = detail.read_text()
          count = text.count('getUserSafeError(error)')
          if count != 5:
              raise SystemExit(f'expected 5 detail safe-error calls, found {count}')
          text = text.replace("getUserSafeError(error)", "getUserSafeError(error, 'Please try again.')")
          if 'Aagaam operations can now review this delivery.' not in text:
              raise SystemExit('canonical Aagaam copy correction is missing')
          detail.write_text(text)

          plans = Path('apps/mobile-customer/src/screens/customer/SubscriptionPlansScreen.tsx')
          text = plans.read_text()
          needle = "          const savings = Math.max(0, Number(item.mrpPaise || 0) - Number(item.pricePaise || 0));\n"
          old_image = "{item.mobileImageUrl || item.imageUrl ? <Image source={{ uri: item.mobileImageUrl || item.imageUrl }}"
          if text.count(needle) != 1 or text.count(old_image) != 1:
              raise SystemExit('subscription plan image source did not match expected code')
          text = text.replace(needle, needle + "          const imageUri = item.mobileImageUrl ?? item.imageUrl ?? undefined;\n", 1)
          text = text.replace(old_image, "{imageUri ? <Image source={{ uri: imageUri }}", 1)
          plans.write_text(text)

          review = Path('apps/mobile-customer/src/screens/customer/SubscriptionReviewScreen.tsx')
          text = review.read_text()
          if text.count('getUserSafeError(error)') != 2:
              raise SystemExit('expected 2 review safe-error calls')
          import_needle = "  type CustomerAddress,\n"
          alias_needle = "const methodOptions: MethodOption[] = ["
          memo_needle = "  const quotePayload = useMemo(() => plan ? ({"
          if text.count(import_needle) != 1 or text.count(alias_needle) != 1 or text.count(memo_needle) != 1:
              raise SystemExit('subscription review typing anchors did not match expected code')
          text = text.replace(import_needle, "  type CreateSubscriptionPayload,\n" + import_needle, 1)
          text = text.replace(alias_needle, "type SubscriptionQuotePayload = Omit<CreateSubscriptionPayload, 'planId' | 'trustedDropInstructions' | 'dropPointToken'>;\n\n" + alias_needle, 1)
          text = text.replace(memo_needle, "  const quotePayload = useMemo<SubscriptionQuotePayload | null>(() => plan ? ({", 1)
          text = text.replace("getUserSafeError(error)", "getUserSafeError(error, 'Please try again.')")
          review.write_text(text)
          PY

          rm .github/workflows/subscription-customer-type-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-customer/src/screens/customer/SubscriptionDetailScreen.tsx \
                  apps/mobile-customer/src/screens/customer/SubscriptionPlansScreen.tsx \
                  apps/mobile-customer/src/screens/customer/SubscriptionReviewScreen.tsx \
                  .github/workflows/subscription-customer-type-fix.yml
          git commit -m "fix(mobile-customer): satisfy subscription TypeScript contracts"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
