name: Apply Aagaam Visible Brand Fix

on:
  push:
    branches: ["agent/aagaam-ui-support-account-fixes"]
    paths: [".github/workflows/aagaam-visible-brand-fix.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aagaam-ui-support-account-fixes
          fetch-depth: 0

      - name: Replace controlled visible legacy brand copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'apps/admin-dashboard/src/lib/pushNotifications.ts': [
                  ("'AAGAM update'", "'AAGAAM update'"),
              ],
              'apps/admin-dashboard/src/app/(admin)/admin/stores/page.tsx': [
                  ('Aagam Commerce Operations', 'Aagaam Commerce Operations'),
              ],
              'apps/admin-dashboard/src/app/page.tsx': [
                  ('Aagam combines customer storefront', 'Aagaam combines customer storefront'),
                  ('Aagam Command', 'Aagaam Command'),
                  ("'Aagam offer'", "'Aagaam offer'"),
                  ('© 2026 Aagam Commerce OS', '© 2026 Aagaam Commerce OS'),
                  ('Deliver with Aagam', 'Deliver with Aagaam'),
                  ('href="/login">Customer support', 'href="/shop/support">Customer support'),
              ],
              'apps/admin-dashboard/src/app/(shop)/shop/orders/[id]/page.tsx': [
                  ('ordering with Aagam.', 'ordering with Aagaam.'),
              ],
              'apps/admin-dashboard/src/app/(shop)/shop/delivery-code/[deliveryJobId]/page.tsx': [
                  ('AAGAM staff should never ask', 'AAGAAM staff should never ask'),
              ],
              'apps/admin-dashboard/src/components/Sidebar.tsx': [
                  ('"Aagam Customer"', '"Aagaam Customer"'),
              ],
              'apps/mobile-customer/src/ui/CustomerToast.tsx': [
                  ("text1 || 'AAGAM'", "text1 || 'AAGAAM'"),
              ],
              'apps/mobile-customer/src/screens/customer/CheckoutScreen.tsx': [
                  ('AAGAM uses precise location', 'Aagaam uses precise location'),
              ],
              'apps/mobile-customer/src/components/promotions/PromotionCarousel.tsx': [
                  ('Published offers from Aagam', 'Published offers from Aagaam'),
              ],
              'apps/mobile-partners/src/onboarding/applicationReviewProgress.ts': [
                  ('Submitted to AAGAM', 'Submitted to AAGAAM'),
              ],
              'apps/mobile-partners/src/screens/PartnerVerificationScreen.tsx': [
                  ('AAGAM never asks you', 'AAGAAM never asks you'),
              ],
              'apps/mobile-partners/src/screens/PartnerActivationScreen.tsx': [
                  ('AAGAM Admin cannot view', 'AAGAAM Admin cannot view'),
              ],
              'apps/mobile-partners/src/screens/StoreApplicationScreen.tsx': [
                  ('AAGAM uses this one-time location', 'Aagaam uses this one-time location'),
                  ('Join AAGAM as a Store', 'Join Aagaam as a Store'),
              ],
              'apps/mobile-partners/src/screens/PartnerDocumentsScreen.tsx': [
                  ('ready for AAGAM review', 'ready for Aagaam review'),
              ],
              'apps/mobile-partners/src/screens/RiderApplicationScreen.tsx': [
                  ('AAGAM uses your location', 'Aagaam uses your location'),
                  ('Become an AAGAM Rider', 'Become an Aagaam Rider'),
                  ('Contact AAGAM operations.', 'Contact Aagaam operations.'),
              ],
              'apps/mobile-partners/src/screens/rider/RiderDashboard.tsx': [
                  ("'AAGAM store'", "'Aagaam store'"),
                  ("startMobilePushLifecycle('AAGAM Partners')", "startMobilePushLifecycle('Aagaam Partners')"),
                  ('AAGAM Partners uses precise location', 'Aagaam Partners uses precise location'),
                  ('AAGAM PARTNERS', 'AAGAAM PARTNERS'),
              ],
              'apps/mobile-partners/src/screens/rider/RiderDeliveryOperationsScreen.tsx': [
                  ('“AAGAM delivery tracking active”', '“AAGAAM delivery tracking active”'),
                  ("'AAGAM Store'", "'Aagaam Store'"),
              ],
              'apps/mobile-partners/src/screens/rider/RiderProfileScreen.tsx': [
                  ('AAGAM PARTNERS', 'AAGAAM PARTNERS'),
                  ("'AAGAM Rider'", "'Aagaam Rider'"),
              ],
              'apps/mobile-partners/src/screens/rider/RiderPickupOperationsScreen.tsx': [
                  ("'AAGAM store'", "'Aagaam store'"),
              ],
              'apps/mobile-partners/src/screens/PartnerApplicationStartScreen.tsx': [
                  ('primary AAGAM login', 'primary Aagaam login'),
              ],
              'apps/mobile-partners/android/app/src/main/java/com/aagampartners/RiderTrackingService.kt': [
                  ('setContentTitle("AAGAM delivery tracking active")', 'setContentTitle("AAGAAM delivery tracking active")'),
              ],
              'apps/mobile-partners/android/app/src/main/java/com/aagampartners/RiderOnlineService.kt': [
                  ('setContentTitle("AAGAM — You are online")', 'setContentTitle("AAGAAM — You are online")'),
              ],
              'apps/admin-dashboard/src/app/(shop)/shop/support/page.tsx': [
                  ('priority?: string;\n  };', 'priority?: string;\n    createdAt?: string;\n  };'),
              ],
              '.github/workflows/aagaam-customer-experience.yml': [
                  ('run: node scripts/aagaam-customer-experience.contract.test.js', 'run: |\n          node scripts/aagaam-customer-experience.contract.test.js\n          node scripts/aagaam-visible-brand.contract.test.js'),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected controlled string not found in {filename}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(filename)

          audit = r'''const { readFileSync } = require('node:fs');
          const { resolve } = require('node:path');
          const assert = require('node:assert/strict');

          const root = resolve(__dirname, '..');
          const read = (path) => readFileSync(resolve(root, path), 'utf8');

          const forbidden = {
            'apps/admin-dashboard/src/lib/pushNotifications.ts': ["'AAGAM update'"],
            'apps/admin-dashboard/src/app/(admin)/admin/stores/page.tsx': ['Aagam Commerce Operations'],
            'apps/admin-dashboard/src/app/page.tsx': ['Aagam combines customer storefront', 'Aagam Command', "'Aagam offer'", '© 2026 Aagam Commerce OS', 'Deliver with Aagam', 'href="/login">Customer support'],
            'apps/admin-dashboard/src/app/(shop)/shop/orders/[id]/page.tsx': ['ordering with Aagam.'],
            'apps/admin-dashboard/src/app/(shop)/shop/delivery-code/[deliveryJobId]/page.tsx': ['AAGAM staff should never ask'],
            'apps/admin-dashboard/src/components/Sidebar.tsx': ['"Aagam Customer"'],
            'apps/mobile-customer/src/ui/CustomerToast.tsx': ["text1 || 'AAGAM'"],
            'apps/mobile-customer/src/screens/customer/CheckoutScreen.tsx': ['AAGAM uses precise location'],
            'apps/mobile-customer/src/components/promotions/PromotionCarousel.tsx': ['Published offers from Aagam'],
            'apps/mobile-partners/src/onboarding/applicationReviewProgress.ts': ['Submitted to AAGAM'],
            'apps/mobile-partners/src/screens/PartnerVerificationScreen.tsx': ['AAGAM never asks you'],
            'apps/mobile-partners/src/screens/PartnerActivationScreen.tsx': ['AAGAM Admin cannot view'],
            'apps/mobile-partners/src/screens/StoreApplicationScreen.tsx': ['AAGAM uses this one-time location', 'Join AAGAM as a Store'],
            'apps/mobile-partners/src/screens/PartnerDocumentsScreen.tsx': ['ready for AAGAM review'],
            'apps/mobile-partners/src/screens/RiderApplicationScreen.tsx': ['AAGAM uses your location', 'Become an AAGAM Rider', 'Contact AAGAM operations.'],
            'apps/mobile-partners/src/screens/rider/RiderDashboard.tsx': ["'AAGAM store'", "startMobilePushLifecycle('AAGAM Partners')", 'AAGAM Partners uses precise location', 'AAGAM PARTNERS'],
            'apps/mobile-partners/src/screens/rider/RiderDeliveryOperationsScreen.tsx': ['“AAGAM delivery tracking active”', "'AAGAM Store'"],
            'apps/mobile-partners/src/screens/rider/RiderProfileScreen.tsx': ['AAGAM PARTNERS', "'AAGAM Rider'"],
            'apps/mobile-partners/src/screens/rider/RiderPickupOperationsScreen.tsx': ["'AAGAM store'"],
            'apps/mobile-partners/src/screens/PartnerApplicationStartScreen.tsx': ['primary AAGAM login'],
            'apps/mobile-partners/android/app/src/main/java/com/aagampartners/RiderTrackingService.kt': ['setContentTitle("AAGAM delivery tracking active")'],
            'apps/mobile-partners/android/app/src/main/java/com/aagampartners/RiderOnlineService.kt': ['setContentTitle("AAGAM — You are online")'],
          };

          for (const [path, values] of Object.entries(forbidden)) {
            const source = read(path);
            for (const value of values) assert.ok(!source.includes(value), `${path} still exposes legacy visible branding: ${value}`);
          }

          const landing = read('apps/admin-dashboard/src/app/page.tsx');
          assert.ok(landing.includes('href="/shop/support">Customer support'), 'The public footer must route Customer support to the implemented support workspace.');
          assert.ok(read('apps/mobile-partners/android/app/src/main/java/com/aagampartners/PartnerDocumentPickerModule.kt').includes('Pictures/AAGAM Partners'), 'The existing internal Android media path must remain unchanged.');
          assert.ok(read('apps/mobile-partners/android/app/src/main/AndroidManifest.xml').includes('aagam_priority_operations_v2'), 'The internal notification channel ID must remain unchanged.');

          console.log('Aagaam visible brand contracts passed.');
          '''
          Path('scripts/aagaam-visible-brand.contract.test.js').write_text(audit.replace('\n          ', '\n').lstrip())
          print('Updated controlled presentation files:', len(changed))
          PY

      - name: Validate all Aagaam contracts
        run: |
          node scripts/aagaam-customer-experience.contract.test.js
          node scripts/aagam-production-ux.contract.test.js
          node scripts/aagaam-visible-brand.contract.test.js
          npx --yes node@22 --experimental-strip-types --test apps/mobile-customer/src/auth/customerPhoneOtpFlow.test.mjs

      - name: Commit bulk presentation cleanup
        shell: bash
        run: |
          git config user.name "Saikumar Bali"
          git config user.email "178761198+Saikumar-bali@users.noreply.github.com"
          git add .
          git commit -m "fix: complete visible Aagaam branding and support contracts"
          git push origin HEAD:agent/aagaam-ui-support-account-fixes
