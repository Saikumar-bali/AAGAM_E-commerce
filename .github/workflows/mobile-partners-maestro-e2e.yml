name: Partners APK Maestro E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile-partners/**"
      - "apps/api-gateway/**"
      - "packages/mobile-shared/**"
      - "packages/database/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-partners-maestro-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile-partners/**"
      - "apps/api-gateway/**"
      - "packages/mobile-shared/**"
      - "packages/database/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-partners-maestro-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partners-maestro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.3"
  MAESTRO_VERSION: "2.4.0"
  MAESTRO_STORE_EMAIL: "maestro.store@aagam.test"
  MAESTRO_EMPTY_STORE_EMAIL: "maestro.empty@aagam.test"
  MAESTRO_STORE_PASSWORD: "Maestro@2026!"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aagam_maestro"
  REDIS_URL: "redis://localhost:6379"
  JWT_SECRET: "aagam-maestro-ci-only-jwt-secret"
  NODE_ENV: "test"

jobs:
  partners-release-maestro:
    name: Partners release APK - Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_maestro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable Linux KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Build shared workspace packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Apply database migrations
        run: |
          npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
          npx prisma migrate status --schema packages/database/prisma/schema.prisma

      - name: Seed isolated Maestro scenario
        run: node apps/mobile-partners/maestro/setup-e2e-data.js

      - name: Build API gateway
        run: npx turbo build --filter=@aagam/api-gateway --cache-dir=.turbo --force

      - name: Start local API gateway for Android emulator
        shell: bash
        run: |
          mkdir -p artifacts/maestro
          node apps/api-gateway/dist/src/main.js > artifacts/maestro/api-gateway.log 2>&1 &
          echo $! > artifacts/maestro/api-gateway.pid
          for attempt in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3005/health >/dev/null; then
              echo "API gateway is ready for the emulator."
              exit 0
            fi
            sleep 2
          done
          cat artifacts/maestro/api-gateway.log
          exit 1
        env:
          PORT: "3005"
          CORS_ORIGINS: "http://10.0.2.2:3005"
          PLAYWRIGHT_QA: "true"
          PLAYWRIGHT_QA_SEED: "true"

      - name: Configure release APK for local emulator API
        shell: bash
        run: |
          cat > apps/mobile-partners/.env <<EOF
          API_URL=http://10.0.2.2:3005
          APP_VARIANT=PARTNERS
          APP_VERSION_CODE=${GITHUB_RUN_NUMBER}
          EOF

      - name: Build x86_64 release-mode Partners APK
        working-directory: apps/mobile-partners/android
        run: >-
          gradle assembleRelease --stacktrace
          -PreactNativeArchitectures=x86_64
          -PE2E_ALLOW_CLEARTEXT=true
          -PVERSION_CODE=${{ github.run_number }}
          -PVERSION_NAME=maestro.${{ github.run_number }}.${{ github.run_attempt }}

      - name: Collect release APK metadata
        shell: bash
        run: |
          mkdir -p release artifacts/maestro
          cp apps/mobile-partners/android/app/build/outputs/apk/release/app-release.apk \
            release/aagam-partners-maestro-release.apk
          sha256sum release/aagam-partners-maestro-release.apk \
            | tee artifacts/maestro/apk-sha256.txt
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging release/aagam-partners-maestro-release.apk \
            | tee artifacts/maestro/apk-badging.txt
          keytool -printcert -jarfile release/aagam-partners-maestro-release.apk \
            > artifacts/maestro/apk-signing-certificate.txt

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          export MAESTRO_VERSION="${MAESTRO_VERSION}"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version \
            | tee artifacts/maestro/maestro-version.txt

      - name: Run release APK flows on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: "true"
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
          MAESTRO_DISABLE_UPDATE_CHECK: "true"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "60000"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r release/aagam-partners-maestro-release.apk
            adb shell pm list packages | grep -F com.aagampartners
            adb logcat -c

            set +e
            cd apps/mobile-partners/maestro
            "$HOME/.maestro/bin/maestro" --device="emulator-${EMULATOR_PORT}" test \
              --format=JUNIT \
              --output=../../../artifacts/maestro/junit.xml \
              --test-output-dir=../../../artifacts/maestro/test-output \
              --debug-output=../../../artifacts/maestro/debug \
              --test-suite-name="AAGAM Partners release APK" \
              -e MAESTRO_STORE_EMAIL="${MAESTRO_STORE_EMAIL}" \
              -e MAESTRO_EMPTY_STORE_EMAIL="${MAESTRO_EMPTY_STORE_EMAIL}" \
              -e MAESTRO_STORE_PASSWORD="${MAESTRO_STORE_PASSWORD}" \
              flows
            maestro_status=$?
            cd "$GITHUB_WORKSPACE"
            adb logcat -d > artifacts/maestro/android-logcat.txt
            adb shell dumpsys package com.aagampartners > artifacts/maestro/android-package-dump.txt
            adb exec-out screencap -p > artifacts/maestro/final-device-screen.png || true
            exit "$maestro_status"

      - name: Verify inventory and audit ledger state
        run: node apps/mobile-partners/maestro/verify-e2e-data.js

      - name: Stop API gateway
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/maestro/api-gateway.pid ]]; then
            kill "$(cat artifacts/maestro/api-gateway.pid)" 2>/dev/null || true
          fi

      - name: Upload Maestro release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aagam-partners-maestro-release-proof
          path: |
            artifacts/maestro/**
            release/aagam-partners-maestro-release.apk
          if-no-files-found: error
          retention-days: 14
