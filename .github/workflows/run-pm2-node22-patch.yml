name: Run PM2 Node 22 patch

on:
  push:
    branches:
      - fix/pm2-node22-process-recreation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pm2-node22-process-recreation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply embedded patch
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-pm2-node22-process-recreation.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          block = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(block), '<pm2-node22-patch>', 'exec'))
          PY

      - name: Validate and publish
        run: |
          set -Eeuo pipefail
          bash -n deploy.sh
          AAGAM_NODE_INTERPRETER=/managed/node AAGAM_NPM_CLI=/managed/npm node - <<'NODE'
          const config = require('./ecosystem.config.js');
          for (const app of config.apps) {
            if (app.interpreter !== '/managed/node') throw new Error(`${app.name} missing managed interpreter`);
          }
          if (config.apps.find((app) => app.name === 'admin-dashboard').script !== '/managed/npm') {
            throw new Error('admin dashboard does not use managed npm CLI');
          }
          NODE
          grep -F 'pm2 delete "$app_name"' deploy.sh
          grep -F 'pm2 start ecosystem.config.js --only "$app_name" --update-env' deploy.sh
          grep -F 'fs.realpathSync(`/proc/${pid}/exe`)' deploy.sh
          rm -f .github/workflows/apply-pm2-node22-process-recreation.yml .github/workflows/run-pm2-node22-patch.yml
          git config user.name "Saikumar-bali"
          git config user.email "178761198+Saikumar-bali@users.noreply.github.com"
          git add -f deploy.sh ecosystem.config.js apps/api-gateway/src/production-deploy-safety.contract.spec.ts .github/workflows/apply-pm2-node22-process-recreation.yml .github/workflows/run-pm2-node22-patch.yml
          git commit -m "fix(deploy): recreate PM2 apps under managed Node 22"
          git push origin HEAD:fix/pm2-node22-process-recreation
