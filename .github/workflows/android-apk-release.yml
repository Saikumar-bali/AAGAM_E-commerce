name: Android APK Release

on:
  push:
    branches:
      - main
      - feature/hybrid-ecommerce-core
    paths:
      - "apps/mobile-app/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Leave empty to auto-generate."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile-app/android/.gradle
            apps/mobile-app/android/app/build
          key: android-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile-app/android/**/*.gradle', 'apps/mobile-app/android/gradle.properties', 'apps/mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build shared mobile packages
        run: |
          npm run build --workspace @aagam/types
          npm run build --workspace @aagam/utils

      - name: Configure mobile environment
        run: |
          cat > apps/mobile-app/.env <<EOF
          API_URL=https://aagam-api-production.up.railway.app
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

      - name: Configure Firebase if provided
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile-app/android/app/google-services.json

      - name: Build release APK
        working-directory: apps/mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp apps/mobile-app/android/app/build/outputs/apk/release/app-release.apk release/aagam-staging-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aagam-staging-release-apk
          path: release/aagam-staging-release.apk

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=mobile-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" release/aagam-staging-release.apk \
            --repo "${{ github.repository }}" \
            --title "Aagam Mobile ${{ steps.release_tag.outputs.tag }}" \
            --notes "Staging APK pointed at https://aagam-api-production.up.railway.app" \
            --latest
