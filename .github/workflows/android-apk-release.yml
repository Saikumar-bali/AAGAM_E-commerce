name: Android APK Releases

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile-customer/**"
      - "apps/mobile-partners/**"
      - "packages/mobile-shared/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "scripts/prepare-android-google-auth.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile-customer/**"
      - "apps/mobile-partners/**"
      - "packages/mobile-shared/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "scripts/prepare-android-google-auth.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk-release.yml"
  workflow_dispatch:
    inputs:
      app:
        description: APKs to build
        required: true
        type: choice
        default: both
        options:
          - both
          - customer
          - partners

permissions:
  contents: write

env:
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: android-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select changed apps
    runs-on: ubuntu-latest
    outputs:
      customer: ${{ steps.apps.outputs.customer }}
      partners: ${{ steps.apps.outputs.partners }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Detect affected apps
        id: apps
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app }}
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          customer=false
          partners=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "$REQUESTED_APP" == "both" || "$REQUESTED_APP" == "customer" ]] && customer=true
            [[ "$REQUESTED_APP" == "both" || "$REQUESTED_APP" == "partners" ]] && partners=true
          else
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            changed="$(git diff --name-only "$base" "$RELEASE_SHA")"
            echo "$changed"

            if grep -Eq '^(packages/(mobile-shared|types|utils)/|scripts/prepare-android-google-auth\.sh$|package(-lock)?\.json$|\.github/workflows/android-apk-release\.yml$)' <<<"$changed"; then
              customer=true
              partners=true
            fi
            grep -Eq '^apps/mobile-customer/' <<<"$changed" && customer=true || true
            grep -Eq '^apps/mobile-partners/' <<<"$changed" && partners=true || true
          fi

          echo "customer=$customer" >> "$GITHUB_OUTPUT"
          echo "partners=$partners" >> "$GITHUB_OUTPUT"

  customer:
    name: Customer APK
    needs: changes
    if: needs.changes.outputs.customer == 'true'
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://aagam.accesscam.org/api' }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID_CUSTOMER || secrets.GOOGLE_ANDROID_CLIENT_ID_CUSTOMER }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      AAGAM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      AAGAM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      AAGAM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace @aagam/types
          npm run build --workspace @aagam/utils

      - name: Configure and validate Customer Google Sign-In
        shell: bash
        run: |
          printf 'API_URL=%s\nGOOGLE_WEB_CLIENT_ID=%s\nGOOGLE_ANDROID_CLIENT_ID=%s\n' \
            "$API_URL" "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_ANDROID_CLIENT_ID" > apps/mobile-customer/.env
          bash scripts/prepare-android-google-auth.sh \
            customer \
            com.aagamcustomer \
            apps/mobile-customer/android/app/google-services.json \
            apps/mobile-customer/scripts/validate-google-signin-config.js \
            release-proof

      - name: Build optimized Customer APK
        working-directory: apps/mobile-customer/android
        run: >-
          gradle assembleRelease --stacktrace
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          -PVERSION_CODE=${{ github.run_number }}
          -PVERSION_NAME=1.${{ github.run_number }}.${{ github.run_attempt }}

      - name: Name Customer APK
        shell: bash
        run: |
          mkdir -p release
          cp apps/mobile-customer/android/app/build/outputs/apk/release/app-release.apk \
            "release/aagam-customer-${GITHUB_RUN_NUMBER}-${RELEASE_SHA::7}.apk"

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: aagam-customer-apk
          path: release/aagam-customer-*.apk
          if-no-files-found: error

      - name: Upload Customer Google proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aagam-customer-google-signin-proof
          path: release-proof/customer-google-signin-proof.md
          if-no-files-found: warn

  partners:
    name: Partners APK
    needs: changes
    if: needs.changes.outputs.partners == 'true'
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://aagam.accesscam.org/api' }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID_PARTNERS || secrets.GOOGLE_ANDROID_CLIENT_ID_PARTNERS }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_PARTNERS }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      AAGAM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      AAGAM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      AAGAM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace @aagam/types
          npm run build --workspace @aagam/utils

      - name: Configure and validate Partners Google Sign-In
        shell: bash
        run: |
          printf 'API_URL=%s\nGOOGLE_WEB_CLIENT_ID=%s\nGOOGLE_ANDROID_CLIENT_ID=%s\n' \
            "$API_URL" "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_ANDROID_CLIENT_ID" > apps/mobile-partners/.env
          bash scripts/prepare-android-google-auth.sh \
            partners \
            com.aagampartners \
            apps/mobile-partners/android/app/google-services.json \
            apps/mobile-partners/scripts/validate-google-signin-config.js \
            release-proof

      - name: Build optimized Partners APK
        working-directory: apps/mobile-partners/android
        run: >-
          gradle assembleRelease --stacktrace
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          -PVERSION_CODE=${{ github.run_number }}
          -PVERSION_NAME=1.${{ github.run_number }}.${{ github.run_attempt }}

      - name: Name Partners APK
        shell: bash
        run: |
          mkdir -p release
          cp apps/mobile-partners/android/app/build/outputs/apk/release/app-release.apk \
            "release/aagam-partners-${GITHUB_RUN_NUMBER}-${RELEASE_SHA::7}.apk"

      - name: Upload Partners APK
        uses: actions/upload-artifact@v4
        with:
          name: aagam-partners-apk
          path: release/aagam-partners-*.apk
          if-no-files-found: error

      - name: Upload Partners Google proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aagam-partners-google-signin-proof
          path: release-proof/partners-google-signin-proof.md
          if-no-files-found: warn

  publish:
    name: Publish APK release
    needs: [changes, customer, partners]
    if: always() && (needs.customer.result == 'success' || needs.partners.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: aagam-*-apk
          path: release
          merge-multiple: true

      - name: Publish trusted preview or stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ vars.API_URL || 'https://aagam.accesscam.org/api' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Pull-request APKs and Google Sign-In proof files are available as workflow artifacts."
            exit 0
          fi

          short_sha="${RELEASE_SHA::7}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="android-${GITHUB_RUN_NUMBER}-${short_sha}"
            title="AAGAM Android ${GITHUB_RUN_NUMBER}"
            channel_flag="--latest"
            channel="Stable"
          else
            tag="android-preview-${GITHUB_RUN_NUMBER}-${short_sha}"
            title="AAGAM Android Preview ${GITHUB_RUN_NUMBER}"
            channel_flag="--prerelease"
            channel="Preview"
          fi

          apk_list="$(find release -maxdepth 1 -name '*.apk' -printf '%f\n' | sort | sed 's/^/- /')"
          notes="$(printf '%s\n\nBackend: %s\nAndroid: 12–15\n\nBuilt APKs:\n%s\n\nEvery APK passed package, OAuth client, google-services.json, and signing SHA-1 validation before build.' "$channel build from $short_sha." "$API_URL" "$apk_list")"
          gh release create "$tag" release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$title" \
            --notes "$notes" \
            "$channel_flag"
