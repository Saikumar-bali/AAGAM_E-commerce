name: Partners Inventory Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile-partners/**"
      - "packages/utils/**"
      - ".github/workflows/partners-inventory-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture typecheck and targeted-test output
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/partners-inventory
          npm run build --workspace @aagam/types > artifacts/partners-inventory/types-build.log 2>&1
          types_status=$?
          npm run build --workspace @aagam/utils > artifacts/partners-inventory/utils-build.log 2>&1
          utils_status=$?
          npm run typecheck --workspace=apps/mobile-partners > artifacts/partners-inventory/partners-typecheck.log 2>&1
          typecheck_status=$?
          npm test --workspace=apps/mobile-partners -- src/domain/storeInventoryPresentation.spec.ts src/domain/storeInventoryScreen.contract.spec.ts > artifacts/partners-inventory/partners-tests.log 2>&1
          tests_status=$?
          printf 'types=%s\nutils=%s\ntypecheck=%s\ntests=%s\n' "$types_status" "$utils_status" "$typecheck_status" "$tests_status" | tee artifacts/partners-inventory/status.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: partners-inventory-diagnostics
          path: artifacts/partners-inventory/**
          if-no-files-found: error
          retention-days: 7
