name: One-time Order Socket Cleanup

on:
  push:
    branches:
      - agent/security-and-issue-hardening
    paths:
      - .github/workflows/one-time-order-socket-cleanup.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-and-issue-hardening
          fetch-depth: 0

      - name: Fix React effect socket cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/admin-dashboard/src/app/(shop)/shop/orders/[id]/page.tsx')
          text = path.read_text()
          old = '    return () => socket.disconnect();'
          new = '    return () => { socket.disconnect(); };'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one cleanup expression, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit target file only
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "apps/admin-dashboard/src/app/(shop)/shop/orders/[id]/page.tsx" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/admin-dashboard/src/app/(shop)/shop/orders/[id]/page.tsx'
          git commit -m "Fix customer order socket cleanup typing"
          git push origin HEAD:agent/security-and-issue-hardening
