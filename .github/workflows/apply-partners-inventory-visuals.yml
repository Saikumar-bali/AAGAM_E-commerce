name: Apply Partners Inventory Visuals

on:
  push:
    branches:
      - fix/partners-inventory-images-price
    paths:
      - scripts/apply-partners-inventory-visuals.py
      - .github/workflows/apply-partners-inventory-visuals.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/partners-inventory-images-price
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply deterministic source patch
        run: python3 scripts/apply-partners-inventory-visuals.py

      - name: Build shared packages
        run: |
          npm run build --workspace @aagam/types
          npm run build --workspace @aagam/utils

      - name: Run targeted Partners tests
        run: npm test --workspace=apps/mobile-partners -- src/domain/storeInventoryPrice.spec.ts src/domain/storeInventoryScreen.contract.spec.ts

      - name: Typecheck Partners application
        run: npm run typecheck --workspace=apps/mobile-partners

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-partners-inventory-visuals.py
          rm .github/workflows/apply-partners-inventory-visuals.yml

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show product images and selling prices in Partners inventory"
          git push origin HEAD:fix/partners-inventory-images-price
