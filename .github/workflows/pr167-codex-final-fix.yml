name: PR 167 Final Codex Remediation

on:
  workflow_call:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aagam_pr167_final
      NODE_ENV: test
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/resolve-146-166
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Apply final Codex fixes
        run: python .github/pr167-codex-final-runner.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Build shared packages
        run: |
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json

      - name: Typecheck Partners app
        run: npx tsc --project apps/mobile-partners/tsconfig.json --noEmit

      - name: Build API
        run: npm run build --workspace @aagam/api-gateway

      - name: Run affected delivery contracts
        run: >
          npx jest --config apps/api-gateway/jest.config.js --runInBand --runTestsByPath
          apps/api-gateway/src/auto-dispatch-recovery.contract.spec.ts
          apps/api-gateway/src/mobile-commerce-hardening.contract.spec.ts
          apps/api-gateway/src/order-delivery-mobile-ui.contract.spec.ts
          apps/api-gateway/src/partner-operations-stabilization.contract.spec.ts

      - name: Run full Partners tests
        run: npm test --workspace AagamPartners -- --runInBand

      - name: Commit verified final fixes
        shell: bash
        run: |
          rm .github/pr167-codex-final-fix.py .github/pr167-codex-final-runner.py .github/workflows/pr167-codex-final-fix.yml
          git diff --check
          git config user.name "PR 167 Final Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix final PR 167 Codex findings"
          git push origin HEAD:agent/resolve-146-166
