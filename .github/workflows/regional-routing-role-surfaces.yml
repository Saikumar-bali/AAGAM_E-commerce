name: Regional routing role surfaces

on:
  push:
    branches:
      - feature/regional-multi-rider-route-splitting
    paths:
      - .github/workflows/regional-routing-role-surfaces.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regional-multi-rider-route-splitting
          fetch-depth: 0
      - name: Apply guarded role-surface patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str, label: str):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name} / {label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          # API includes: the role clients receive the authoritative zone and route estimates.
          replace_once(
              'apps/api-gateway/src/subscriptions/delivery-run-operations.service.ts',
              "        store: { select: { id: true, name: true, address: true, latitude: true, longitude: true } },\n        stops: {",
              "        store: { select: { id: true, name: true, address: true, latitude: true, longitude: true } },\n        deliveryZone: true,\n        stops: {",
              'rider detail zone include',
          )
          replace_once(
              'apps/api-gateway/src/subscriptions/delivery-run-operations.service.ts',
              "        store: { select: { id: true, name: true, address: true, latitude: true, longitude: true } },\n        _count: { select: { stops: true } },",
              "        store: { select: { id: true, name: true, address: true, latitude: true, longitude: true } },\n        deliveryZone: true,\n        _count: { select: { stops: true } },",
              'rider list zone include',
          )
          replace_once(
              'apps/api-gateway/src/subscriptions/delivery-run-planning.service.ts',
              "      include: {\n        rider: { include: { user: { select: { id: true, name: true, phone: true } } } },\n        stops: {",
              "      include: {\n        deliveryZone: true,\n        rider: { include: { user: { select: { id: true, name: true, phone: true } } } },\n        stops: {",
              'store route zone include',
          )

          # Shared Partners API model.
          replace_once(
              'apps/mobile-partners/src/api/subscriptionOperationsService.ts',
              "export type DeliveryRunStatus =\n  | 'PLANNED'\n  | 'READY_FOR_PICKUP'",
              "export type DeliveryRunStatus =\n  | 'PLANNED'\n  | 'RIDER_NEEDED'\n  | 'READY_FOR_PICKUP'",
              'rider-needed status',
          )
          replace_once(
              'apps/mobile-partners/src/api/subscriptionOperationsService.ts',
              "  | 'AWAITING_SETTLEMENT'\n  | 'COMPLETED'",
              "  | 'AWAITING_SETTLEMENT'\n  | 'INTERRUPTED'\n  | 'RECOVERY_REQUIRED'\n  | 'COMPLETED'",
              'recovery statuses',
          )
          replace_once(
              'apps/mobile-partners/src/api/subscriptionOperationsService.ts',
              "  routeCode: string;\n  serviceDate: string;",
              "  routeCode: string;\n  deliveryZoneId?: string | null;\n  deliveryZone?: { id: string; code: string; name: string; maximumStopsPerRun?: number; cashRiskLimitPaise?: number } | null;\n  planningAlgorithmVersion?: string;\n  estimatedDistanceKm: number;\n  estimatedDurationMinutes: number;\n  assignmentReasonSummary?: string | null;\n  assignmentSource?: 'AUTOMATIC' | 'MANUAL' | 'RECOVERY' | null;\n  recoveryFromRunId?: string | null;\n  serviceDate: string;",
              'run regional metadata',
          )
          replace_once(
              'apps/mobile-partners/src/api/subscriptionOperationsService.ts',
              "  subscriptionDeliveryId: string;\n  sequenceNumber: number;",
              "  subscriptionDeliveryId: string;\n  deliveryZoneId?: string | null;\n  deliveryLatitude?: number | null;\n  deliveryLongitude?: number | null;\n  movedFromRunId?: string | null;\n  lastMovedAt?: string | null;\n  sequenceNumber: number;",
              'stop regional metadata',
          )

          # Rider Android run cards.
          replace_once(
              'apps/mobile-partners/src/screens/rider/RiderRunsScreen.tsx',
              "  if (status === 'AWAITING_SETTLEMENT') return { text: '#8A4B00', bg: '#FFF2D9' };\n  if (status === 'COMPLETED')",
              "  if (status === 'AWAITING_SETTLEMENT') return { text: '#8A4B00', bg: '#FFF2D9' };\n  if (['RIDER_NEEDED', 'INTERRUPTED', 'RECOVERY_REQUIRED'].includes(status)) return { text: '#9A3412', bg: '#FFEDD5' };\n  if (status === 'COMPLETED')",
              'rider risk status tone',
          )
          replace_once(
              'apps/mobile-partners/src/screens/rider/RiderRunsScreen.tsx',
              "          <Text style={styles.routeCode}>{run.routeCode}</Text>\n          <Text style={styles.storeName} numberOfLines={1}>{run.store?.name || 'Assigned store'}</Text>",
              "          <Text style={styles.routeCode}>{run.routeCode}</Text>\n          <Text style={styles.zoneName} numberOfLines={1}>{run.deliveryZone?.name || 'Assigned region'}</Text>\n          <Text style={styles.storeName} numberOfLines={1}>{run.store?.name || 'Assigned store'}</Text>",
              'rider zone label',
          )
          replace_once(
              'apps/mobile-partners/src/screens/rider/RiderRunsScreen.tsx',
              "      <View style={styles.metricRow}>\n        <View style={styles.metric}><PackageCheck size={18} color=\"#087B5A\" /><Text style={styles.metricValue}>{completed}/{total}</Text><Text style={styles.metricLabel}>stops</Text></View>\n        <View style={styles.metric}><Banknote size={18} color=\"#A15C00\" /><Text style={styles.metricValue}>{money(run.collectedCashPaise)}</Text><Text style={styles.metricLabel}>collected</Text></View>\n        <View style={styles.openAction}><Text style={styles.openActionText}>{run.status === 'IN_PROGRESS' ? 'Resume' : 'Open'}</Text><ChevronRight size={18} color=\"#FFFFFF\" /></View>\n      </View>",
              "      <View style={styles.metricRow}>\n        <View style={styles.metric}><PackageCheck size={17} color=\"#087B5A\" /><Text style={styles.metricValue}>{completed}/{total}</Text><Text style={styles.metricLabel}>stops</Text></View>\n        <View style={styles.metric}><MapPinned size={17} color=\"#155E75\" /><Text style={styles.metricValue}>{Number(run.estimatedDistanceKm || 0).toFixed(1)}</Text><Text style={styles.metricLabel}>km</Text></View>\n        <View style={styles.metric}><CalendarDays size={17} color=\"#475569\" /><Text style={styles.metricValue}>{run.estimatedDurationMinutes || 0}</Text><Text style={styles.metricLabel}>min</Text></View>\n        <View style={styles.metric}><Banknote size={17} color=\"#A15C00\" /><Text style={styles.metricValue}>{money(run.expectedCashPaise)}</Text><Text style={styles.metricLabel}>cash</Text></View>\n        <View style={styles.openAction}><Text style={styles.openActionText}>{run.status === 'IN_PROGRESS' ? 'Resume' : 'Open'}</Text><ChevronRight size={18} color=\"#FFFFFF\" /></View>\n      </View>",
              'rider route metrics',
          )
          replace_once(
              'apps/mobile-partners/src/screens/rider/RiderRunsScreen.tsx',
              "  routeCode: { color: '#17211D', fontSize: 16, fontWeight: '900' },\n  storeName:",
              "  routeCode: { color: '#17211D', fontSize: 16, fontWeight: '900' },\n  zoneName: { color: '#087B5A', fontSize: 11, fontWeight: '900', marginTop: 2 },\n  storeName:",
              'rider zone style',
          )
          replace_once(
              'apps/mobile-partners/src/screens/rider/RiderRunsScreen.tsx',
              "  metricRow: { flexDirection: 'row', alignItems: 'center', marginTop: 14, gap: 12 },\n  metric: { flexDirection: 'row', alignItems: 'center', gap: 4 },",
              "  metricRow: { flexDirection: 'row', alignItems: 'center', marginTop: 14, gap: 7, flexWrap: 'wrap' },\n  metric: { flexDirection: 'row', alignItems: 'center', gap: 3 },",
              'rider compact metrics',
          )

          # Rider web regional context.
          replace_once(
              'apps/admin-dashboard/src/app/(rider)/rider/runs/page.tsx',
              "type RunStatus = 'PLANNED' | 'READY_FOR_PICKUP' | 'PICKED_UP' | 'IN_PROGRESS' | 'RETURNING' | 'AWAITING_SETTLEMENT' | 'COMPLETED' | 'CANCELLED';",
              "type RunStatus = 'PLANNED' | 'RIDER_NEEDED' | 'READY_FOR_PICKUP' | 'PICKED_UP' | 'IN_PROGRESS' | 'RETURNING' | 'AWAITING_SETTLEMENT' | 'INTERRUPTED' | 'RECOVERY_REQUIRED' | 'COMPLETED' | 'CANCELLED';",
              'rider web statuses',
          )
          replace_once(
              'apps/admin-dashboard/src/app/(rider)/rider/runs/page.tsx',
              "  routeCode: string;\n  status: RunStatus;",
              "  routeCode: string;\n  deliveryZone?: { id: string; code: string; name: string } | null;\n  estimatedDistanceKm?: number;\n  estimatedDurationMinutes?: number;\n  assignmentReasonSummary?: string | null;\n  status: RunStatus;",
              'rider web route metadata',
          )
          replace_once(
              'apps/admin-dashboard/src/app/(rider)/rider/runs/page.tsx',
              "<div><p className=\"text-xs font-black uppercase tracking-wider text-emerald-700\">{activeRun.routeCode}</p><h2 className=\"mt-1 text-2xl font-black text-slate-950\">{activeRun.store.name}</h2>",
              "<div><p className=\"text-xs font-black uppercase tracking-wider text-emerald-700\">{activeRun.deliveryZone?.name ? `${activeRun.deliveryZone.name} · ` : ''}{activeRun.routeCode}</p><h2 className=\"mt-1 text-2xl font-black text-slate-950\">{activeRun.store.name}</h2>",
              'rider web zone heading',
          )
          replace_once(
              'apps/admin-dashboard/src/app/(rider)/rider/runs/page.tsx',
              "<div className=\"mt-5 grid gap-3 sm:grid-cols-3\"><Metric label=\"Retry pending\" value={String(activeRun.retryPendingStopCount)} /><Metric label=\"Expected cash\" value={money(activeRun.expectedCashPaise)} /><Metric label=\"Rider holding\" value={money(Math.max(0, activeRun.collectedCashPaise - activeRun.depositedCashPaise))} /></div>",
              "<div className=\"mt-5 grid gap-3 sm:grid-cols-5\"><Metric label=\"Retry pending\" value={String(activeRun.retryPendingStopCount)} /><Metric label=\"Distance\" value={`${Number(activeRun.estimatedDistanceKm || 0).toFixed(1)} km`} /><Metric label=\"Estimate\" value={`${activeRun.estimatedDurationMinutes || 0} min`} /><Metric label=\"Expected cash\" value={money(activeRun.expectedCashPaise)} /><Metric label=\"Rider holding\" value={money(Math.max(0, activeRun.collectedCashPaise - activeRun.depositedCashPaise))} /></div>",
              'rider web regional metrics',
          )

          # Store web route-specific region and estimates.
          replace_once(
              'apps/admin-dashboard/src/app/(store)/store/subscriptions/page.tsx',
              "type RunStatus = 'PLANNED' | 'READY_FOR_PICKUP' | 'PICKED_UP' | 'IN_PROGRESS' | 'RETURNING' | 'AWAITING_SETTLEMENT' | 'COMPLETED' | 'CANCELLED';",
              "type RunStatus = 'PLANNED' | 'RIDER_NEEDED' | 'READY_FOR_PICKUP' | 'PICKED_UP' | 'IN_PROGRESS' | 'RETURNING' | 'AWAITING_SETTLEMENT' | 'INTERRUPTED' | 'RECOVERY_REQUIRED' | 'COMPLETED' | 'CANCELLED';",
              'store web statuses',
          )
          replace_once(
              'apps/admin-dashboard/src/app/(store)/store/subscriptions/page.tsx',
              "  routeCode: string;\n  status: RunStatus;",
              "  routeCode: string;\n  deliveryZone?: { id: string; code: string; name: string } | null;\n  estimatedDistanceKm?: number;\n  estimatedDurationMinutes?: number;\n  status: RunStatus;",
              'store web route metadata',
          )
          replace_once(
              'apps/admin-dashboard/src/app/(store)/store/subscriptions/page.tsx',
              "<p className=\"font-black text-slate-950\">{run.routeCode}</p><p className=\"mt-1 text-xs text-slate-500\">{run.rider?.user?.name ? `Rider: ${run.rider.user.name}` : 'Rider not assigned'}</p>",
              "<p className=\"font-black text-slate-950\">{run.routeCode}</p><p className=\"mt-1 text-xs font-bold text-emerald-700\">{run.deliveryZone?.name || 'Assigned region'} · {Number(run.estimatedDistanceKm || 0).toFixed(1)} km · {run.estimatedDurationMinutes || 0} min</p><p className=\"mt-1 text-xs text-slate-500\">{run.rider?.user?.name ? `Rider: ${run.rider.user.name}` : 'Rider not assigned'}</p>",
              'store web regional summary',
          )
          PY
          rm .github/workflows/regional-routing-role-surfaces.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api-gateway/src/subscriptions/delivery-run-operations.service.ts \
            apps/api-gateway/src/subscriptions/delivery-run-planning.service.ts \
            apps/mobile-partners/src/api/subscriptionOperationsService.ts \
            apps/mobile-partners/src/screens/rider/RiderRunsScreen.tsx \
            apps/admin-dashboard/src/app/'(rider)'/rider/runs/page.tsx \
            apps/admin-dashboard/src/app/'(store)'/store/subscriptions/page.tsx \
            .github/workflows/regional-routing-role-surfaces.yml
          git commit -m "feat(routing): show regional responsibility across Rider and Store"
          git push origin HEAD:feature/regional-multi-rider-route-splitting
