name: Validate checkout shared-order test compatibility

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/subscription-delivery-runs-cod'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_checkout_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aagam_checkout_compat
      NODE_ENV: test
      JWT_ACCESS_SECRET: checkout-compat-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: checkout-compat-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscription-delivery-runs-cod
          fetch-depth: 0
      - name: Apply and validate checkout compatibility correction
        env:
          TARGET_BRANCH: feature/subscription-delivery-runs-cod
          PATCH_SHA256: 09c56757cb116cd734a305e1500bd6690eec48c3a24e653db6fc58cd1b564b25
          PATCH_XZ_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_XZ_BASE64" | base64 --decode > /tmp/checkout-test-compat.patch.xz
          echo "$PATCH_SHA256  /tmp/checkout-test-compat.patch.xz" | sha256sum -c -
          xz -dc /tmp/checkout-test-compat.patch.xz > /tmp/checkout-test-compat.patch
          git apply --check /tmp/checkout-test-compat.patch
          git apply --index /tmp/checkout-test-compat.patch
          git rm .github/workflows/checkout-shared-order-test-compat.yml

          npm ci --no-audit --no-fund
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npx prisma validate --schema packages/database/prisma/schema.prisma
          npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json
          npm run build --workspace @aagam/api-gateway
          npm run test:ci --workspace @aagam/api-gateway
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(checkout): align legacy suites with shared order creation'
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${{ github.event.pull_request.head.sha }}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
