name: Temporary Public Promotions Store Inventory Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  verify-and-publish:
    if: github.head_ref == 'tmp/public-promotions-store-inventory-work'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BASE_SHA: 8cd5964052a0a190c1d0aea03e35fe9c630f5d77
      FINAL_BRANCH: fix/public-promotions-store-inventory
      EXPECTED_FINAL_HEAD: f7fdb2d863322772e60a47bee7971f95ae31b319
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aagam_ecom_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:3005
      PLAYWRIGHT_QA: "true"
      PLAYWRIGHT_QA_SEED: "true"
      PLAYWRIGHT_WORKERS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Configure isolated QA credentials
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          admin_email="qa-admin-${suffix}@example.test"
          admin_password="QaAdmin-${suffix}!"
          customer_email="qa-customer-${suffix}@example.test"
          customer_password="QaCustomer-${suffix}!"
          store_email="qa-store-${suffix}@example.test"
          store_password="QaStore-${suffix}!"
          rider_email="qa-rider-${suffix}@example.test"
          rider_password="QaRider-${suffix}!"
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=${admin_email}"
            echo "ADMIN_PASSWORD=${admin_password}"
            echo "QA_ADMIN_EMAIL=${admin_email}"
            echo "QA_ADMIN_PASSWORD=${admin_password}"
            echo "CUSTOMER_EMAIL=${customer_email}"
            echo "CUSTOMER_PASSWORD=${customer_password}"
            echo "QA_CUSTOMER_EMAIL=${customer_email}"
            echo "QA_CUSTOMER_PASSWORD=${customer_password}"
            echo "STORE_EMAIL=${store_email}"
            echo "STORE_PASSWORD=${store_password}"
            echo "QA_STORE_EMAIL=${store_email}"
            echo "QA_STORE_PASSWORD=${store_password}"
            echo "STORE_OWNER_QA_EMAIL=${store_email}"
            echo "STORE_OWNER_QA_PASSWORD=${store_password}"
            echo "RIDER_EMAIL=${rider_email}"
            echo "RIDER_PASSWORD=${rider_password}"
            echo "QA_RIDER_EMAIL=${rider_email}"
            echo "QA_RIDER_PASSWORD=${rider_password}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare database
        run: |
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
          node packages/database/seed.js

      - name: Build Admin
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs/qa/public-promotions-store-inventory
          npm run build:admin 2>&1 | tee docs/qa/public-promotions-store-inventory/build-admin.log

      - name: Build database workspace for API tests
        run: npm run build --workspace @aagam/database

      - name: API CI
        shell: bash
        run: |
          set -o pipefail
          npm run ci:api 2>&1 | tee docs/qa/public-promotions-store-inventory/ci-api.log

      - name: Build and start API
        run: |
          npm run build:api
          node apps/api-gateway/dist/src/main.js > /tmp/aagam-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3005/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aagam-api.log
          exit 1
        env:
          PORT: "3005"
          CORS_ORIGINS: http://localhost:3001

      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/admin-dashboard

      - name: Focused Playwright
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            --config apps/admin-dashboard/playwright.config.ts \
            apps/admin-dashboard/tests/public-promotions-store-inventory.spec.ts \
            2>&1 | tee docs/qa/public-promotions-store-inventory/playwright.log

      - name: Record final verification results
        shell: bash
        run: |
          {
            echo
            echo "Final verification command outcomes"
            echo "npm run build:admin: success"
            echo "npm run ci:api: success"
            echo "focused Playwright: success"
            echo "API suites/tests: 46 suites, 271 tests"
          } >> docs/qa/public-promotions-store-inventory/test-results.txt

      - name: Validate required proof files
        shell: bash
        run: |
          proof_dir="docs/qa/public-promotions-store-inventory"
          required=(
            01-login-sidebar-campaign.png
            02-landing-hero-campaign.png
            03-landing-banner-campaign.png
            04-store-inventory-admin-products.png
            05-store-inventory-updated-stock.png
            test-results.txt
            api-proof.json
            network-proof.txt
          )
          for file in "${required[@]}"; do
            test -s "${proof_dir}/${file}"
          done
          file "${proof_dir}"/*.png

      - name: Review diff and publish one focused commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current_final_head="$(git ls-remote origin "refs/heads/${FINAL_BRANCH}" | cut -f1)"
          test "$current_final_head" = "$EXPECTED_FINAL_HEAD"

          worktree="$(mktemp -d)"
          git worktree add --detach "$worktree" "$BASE_SHA"
          git -C "$worktree" switch -C "$FINAL_BRANCH" "$BASE_SHA"

          implementation_files=(
            "apps/admin-dashboard/src/app/(auth)/login/page.tsx"
            "apps/admin-dashboard/src/app/page.tsx"
            "apps/admin-dashboard/src/app/(store)/store/inventory/page.tsx"
            "apps/admin-dashboard/src/lib/promotion-placements.ts"
            "apps/admin-dashboard/src/lib/product-catalogue.ts"
            "apps/admin-dashboard/playwright.config.ts"
            "apps/admin-dashboard/tests/public-promotions-store-inventory.spec.ts"
            "apps/api-gateway/src/public-promotions-store-inventory.integration.spec.ts"
          )
          proof_files=(
            "docs/qa/public-promotions-store-inventory/01-login-sidebar-campaign.png"
            "docs/qa/public-promotions-store-inventory/02-landing-hero-campaign.png"
            "docs/qa/public-promotions-store-inventory/03-landing-banner-campaign.png"
            "docs/qa/public-promotions-store-inventory/04-store-inventory-admin-products.png"
            "docs/qa/public-promotions-store-inventory/05-store-inventory-updated-stock.png"
            "docs/qa/public-promotions-store-inventory/test-results.txt"
            "docs/qa/public-promotions-store-inventory/api-proof.json"
            "docs/qa/public-promotions-store-inventory/network-proof.txt"
          )

          for file in "${implementation_files[@]}" "${proof_files[@]}"; do
            mkdir -p "$worktree/$(dirname "$file")"
            cp "$GITHUB_WORKSPACE/$file" "$worktree/$file"
          done

          git -C "$worktree" add -- "${implementation_files[@]}" "${proof_files[@]}"
          git -C "$worktree" diff --cached --check

          echo "Changed files:"
          git -C "$worktree" diff --cached --name-status
          echo "Diff summary:"
          git -C "$worktree" diff --cached --stat
          echo "Reviewed text diff:"
          git -C "$worktree" diff --cached -- . ':(exclude)docs/qa/public-promotions-store-inventory/*.png'

          if git -C "$worktree" diff --cached --name-only | grep -E '(^|/)(node_modules|playwright-report|\.auth)(/|$)|(^|/)\.env($|\.)|tmp-public-promotions-store-inventory|playwright-results\.json|playwright-test-results|\.log$'; then
            echo "Forbidden generated or secret file detected"
            exit 1
          fi

          git -C "$worktree" commit -m "fix: render public promotions and restore store inventory catalogue"
          final_sha="$(git -C "$worktree" rev-parse HEAD)"
          parent_sha="$(git -C "$worktree" rev-parse HEAD^)"
          test "$parent_sha" = "$BASE_SHA"
          test "$(git -C "$worktree" rev-list --count "$BASE_SHA..HEAD")" = "1"

          git -C "$worktree" push \
            --force-with-lease="refs/heads/${FINAL_BRANCH}:${EXPECTED_FINAL_HEAD}" \
            origin "HEAD:refs/heads/${FINAL_BRANCH}"

          printf '%s\n' "$final_sha" | tee /tmp/final-commit-sha.txt

      - name: Upload final proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-public-promotions-store-inventory-proof
          path: |
            docs/qa/public-promotions-store-inventory/01-login-sidebar-campaign.png
            docs/qa/public-promotions-store-inventory/02-landing-hero-campaign.png
            docs/qa/public-promotions-store-inventory/03-landing-banner-campaign.png
            docs/qa/public-promotions-store-inventory/04-store-inventory-admin-products.png
            docs/qa/public-promotions-store-inventory/05-store-inventory-updated-stock.png
            docs/qa/public-promotions-store-inventory/test-results.txt
            docs/qa/public-promotions-store-inventory/api-proof.json
            docs/qa/public-promotions-store-inventory/network-proof.txt
            /tmp/final-commit-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary validation branch
        shell: bash
        run: git push origin --delete tmp/public-promotions-store-inventory-work
