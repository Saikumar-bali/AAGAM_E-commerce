name: Temporary Public Promotions Store Inventory Verification

on:
  push:
    branches:
      - "tmp/public-promotions-store-inventory-work"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'tmp/public-promotions-store-inventory-work'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aagam_ecom_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:3005
      PLAYWRIGHT_QA: "true"
      PLAYWRIGHT_QA_SEED: "true"
      PLAYWRIGHT_WORKERS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Configure isolated QA credentials
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          admin_email="qa-admin-${suffix}@example.test"
          admin_password="QaAdmin-${suffix}!"
          customer_email="qa-customer-${suffix}@example.test"
          customer_password="QaCustomer-${suffix}!"
          store_email="qa-store-${suffix}@example.test"
          store_password="QaStore-${suffix}!"
          rider_email="qa-rider-${suffix}@example.test"
          rider_password="QaRider-${suffix}!"
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=${admin_email}"
            echo "ADMIN_PASSWORD=${admin_password}"
            echo "QA_ADMIN_EMAIL=${admin_email}"
            echo "QA_ADMIN_PASSWORD=${admin_password}"
            echo "CUSTOMER_EMAIL=${customer_email}"
            echo "CUSTOMER_PASSWORD=${customer_password}"
            echo "QA_CUSTOMER_EMAIL=${customer_email}"
            echo "QA_CUSTOMER_PASSWORD=${customer_password}"
            echo "STORE_EMAIL=${store_email}"
            echo "STORE_PASSWORD=${store_password}"
            echo "QA_STORE_EMAIL=${store_email}"
            echo "QA_STORE_PASSWORD=${store_password}"
            echo "STORE_OWNER_QA_EMAIL=${store_email}"
            echo "STORE_OWNER_QA_PASSWORD=${store_password}"
            echo "RIDER_EMAIL=${rider_email}"
            echo "RIDER_PASSWORD=${rider_password}"
            echo "QA_RIDER_EMAIL=${rider_email}"
            echo "QA_RIDER_PASSWORD=${rider_password}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare database
        run: |
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
          node packages/database/seed.js

      - name: Build Admin
        id: build_admin
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs/qa/public-promotions-store-inventory
          npm run build:admin 2>&1 | tee docs/qa/public-promotions-store-inventory/build-admin.log

      - name: Build and start API
        run: |
          npm run build:api
          node apps/api-gateway/dist/src/main.js > /tmp/aagam-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3005/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aagam-api.log
          exit 1
        env:
          PORT: "3005"
          CORS_ORIGINS: http://localhost:3001

      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/admin-dashboard

      - name: Focused Playwright
        id: playwright
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            --config apps/admin-dashboard/playwright.config.ts \
            apps/admin-dashboard/tests/public-promotions-store-inventory.spec.ts \
            2>&1 | tee docs/qa/public-promotions-store-inventory/playwright.log

      - name: Record command outcomes
        if: always()
        run: |
          mkdir -p docs/qa/public-promotions-store-inventory
          {
            echo
            echo "Focused browser verification outcomes"
            echo "npm run build:admin: ${{ steps.build_admin.outcome }}"
            echo "focused Playwright: ${{ steps.playwright.outcome }}"
            echo "npm run ci:api: verified separately in run 29742667375 (46 suites, 271 tests)"
          } >> docs/qa/public-promotions-store-inventory/test-results.txt

      - name: Upload proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-promotions-store-inventory-proof
          path: docs/qa/public-promotions-store-inventory
          if-no-files-found: error
          retention-days: 7

      - name: Enforce verification result
        if: always()
        run: |
          [[ "${{ steps.build_admin.outcome }}" == "success" ]]
          [[ "${{ steps.playwright.outcome }}" == "success" ]]
