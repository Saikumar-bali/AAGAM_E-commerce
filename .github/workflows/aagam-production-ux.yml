name: Aagaam Production UX

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["agent/aagaam-production-ux-notifications"]

permissions:
  contents: read

concurrency:
  group: aagam-production-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: UX and notification contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Validate production UX contracts
        run: node scripts/aagam-production-ux.contract.test.js

      - name: Audit remaining UI brand literals
        shell: bash
        run: |
          echo '=== WEB AND REACT NATIVE SOURCE ==='
          grep -RInE --include='*.ts' --include='*.tsx' 'AAGAM|Aagam' apps/admin-dashboard/src apps/mobile-customer/src apps/mobile-partners/src || true
          echo '=== ANDROID PRESENTATION SOURCE ==='
          grep -RInE 'AAGAM|Aagam' apps/mobile-customer/android/app/src/main apps/mobile-partners/android/app/src/main || true
