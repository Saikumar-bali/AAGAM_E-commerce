name: Agent Errors With Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  source-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
      - id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Post normalized diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('build.log', 'utf8').split('\n');
            const pattern = /^(.*\.(?:ts|tsx))\((\d+),(\d+)\): error (TS\d+): (.*)$/;
            const records = [];
            for (const line of lines) {
              const match = line.match(pattern);
              if (!match) continue;
              const [, file, lineNumber, column, code, message] = match;
              let source = '';
              try {
                source = fs.readFileSync(file, 'utf8').split('\n')[Number(lineNumber) - 1]?.trim() || '';
              } catch {}
              records.push({ file, line: Number(lineNumber), column: Number(column), code, message, source });
            }
            const marker = '<!-- agent-errors-with-source -->';
            const body = `${marker}\n### TypeScript errors with source\n\n\`\`\`json\n${JSON.stringify(records, null, 2)}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - if: steps.build.outcome == 'failure'
        run: exit 1
