name: Live Store Owner W1-W7

on:
  push:
    branches: ["qa/live-store-owner-w1-w7-20260722"]
    paths:
      - "scripts/provision-live-qa-store-owner.js"
      - "apps/admin-dashboard/e2e/live-store-owner-w1-w7.spec.ts"
      - "apps/admin-dashboard/e2e/playwright.live-store.config.ts"
      - ".github/workflows/live-store-owner-w1-w7.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/provision-live-qa-store-owner.js"
      - "apps/admin-dashboard/e2e/live-store-owner-w1-w7.spec.ts"
      - "apps/admin-dashboard/e2e/playwright.live-store.config.ts"
      - ".github/workflows/live-store-owner-w1-w7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-store-owner-w1-w7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  live-store-owner-w1-w7:
    name: Provision QA stores and run W1-W7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    env:
      NODE_VERSION: "22.22.3"
      LIVE_BASE_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PUBLIC_HEALTHCHECK_URL: ${{ vars.PUBLIC_HEALTHCHECK_URL }}
      EXPECTED_REVISION: "e6a6280c52fb1fc18610e93df3872f79fda3f85f"

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Validate protected production configuration
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_ENV_FILE_B64: ${{ secrets.PRODUCTION_ENV_FILE_B64 }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$DEPLOY_HOST" ]] || missing+=("DEPLOY_HOST")
          [[ -n "$DEPLOY_USER" ]] || missing+=("DEPLOY_USER")
          [[ -n "$DEPLOY_PATH" ]] || missing+=("DEPLOY_PATH")
          [[ -n "$SSH_PRIVATE_KEY" ]] || missing+=("DEPLOY_SSH_PRIVATE_KEY")
          [[ -n "$SSH_KNOWN_HOSTS" ]] || missing+=("DEPLOY_KNOWN_HOSTS")
          [[ -n "$PRODUCTION_ENV_FILE_B64" ]] || missing+=("PRODUCTION_ENV_FILE_B64")
          if (( ${#missing[@]} )); then
            printf 'Missing protected configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Derive dedicated QA credentials from protected secret material
        shell: bash
        env:
          PRODUCTION_ENV_FILE_B64: ${{ secrets.PRODUCTION_ENV_FILE_B64 }}
        run: |
          set -Eeuo pipefail
          qa_email="live.qa.store.owner@aagam.test"
          digest="$(printf '%s' "${PRODUCTION_ENV_FILE_B64}:AAGAM_LIVE_QA_STORE_OWNER_V1" | sha256sum | awk '{print $1}')"
          qa_password="Qa!9${digest:0:36}"
          echo "::add-mask::$qa_password"
          echo "LIVE_QA_STORE_EMAIL=$qa_email" >> "$GITHUB_ENV"
          echo "LIVE_QA_STORE_PASSWORD=$qa_password" >> "$GITHUB_ENV"

      - name: Configure production SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

      - name: Wait for merged PR 99 revision in production
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="${LIVE_BASE_URL:-https://aagam.accesscam.org}"
          health_url="${PUBLIC_HEALTHCHECK_URL:-${base_url%/}/api/health}"
          for attempt in $(seq 1 90); do
            body="$(curl --location --silent --show-error --max-time 15 "$health_url" || true)"
            if HEALTH_BODY="$body" node -e '
              let value;
              try { value = JSON.parse(process.env.HEALTH_BODY || "{}"); } catch { process.exit(1); }
              if (value.status !== "ok" || value.revision !== process.env.EXPECTED_REVISION) process.exit(1);
            '; then
              echo "Production is serving PR 99 revision $EXPECTED_REVISION"
              exit 0
            fi
            echo "Waiting for PR 99 deployment ($attempt/90)"
            sleep 10
          done
          echo "Production did not reach revision $EXPECTED_REVISION"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/admin-dashboard

      - name: Prepare protected bootstrap input
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p docs/qa/live-store-owner-w1-w7
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('/tmp/aagam-live-qa-input.json', JSON.stringify({
            mode: 'provision',
            email: process.env.LIVE_QA_STORE_EMAIL,
            password: process.env.LIVE_QA_STORE_PASSWORD,
          }));
          NODE
          chmod 600 /tmp/aagam-live-qa-input.json

      - name: Provision dedicated QA owner and two stores
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_script="/tmp/aagam-provision-live-qa-${GITHUB_RUN_ID}.js"
          remote_input="/tmp/aagam-live-qa-input-${GITHUB_RUN_ID}.json"
          scp -q "${ssh_options[@]}" scripts/provision-live-qa-store-owner.js "$target:$remote_script"
          scp -q "${ssh_options[@]}" /tmp/aagam-live-qa-input.json "$target:$remote_input"
          printf -v app_path '%q' "$DEPLOY_PATH"
          printf -v script_path '%q' "$remote_script"
          printf -v input_path '%q' "$remote_input"
          ssh "${ssh_options[@]}" "$target" "cd $app_path && node $script_path < $input_path" \
            > docs/qa/live-store-owner-w1-w7/bootstrap.json

      - name: Export QA store identifiers
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('docs/qa/live-store-owner-w1-w7/bootstrap.json', 'utf8'));
          const rows = {
            LIVE_QA_STORE_A_ID: value.storeA.id,
            LIVE_QA_STORE_A_NAME: value.storeA.name,
            LIVE_QA_MARKER_A: value.storeA.markerName,
            LIVE_QA_STORE_B_ID: value.storeB.id,
            LIVE_QA_STORE_B_NAME: value.storeB.name,
            LIVE_QA_MARKER_B: value.storeB.markerName,
          };
          for (const [key, item] of Object.entries(rows)) {
            if (!item || String(item).includes('\n')) throw new Error(`Invalid bootstrap output for ${key}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${item}\n`);
          }
          NODE

      - name: Run production browser scenarios W1-W7
        run: npx playwright test -c e2e/playwright.live-store.config.ts
        working-directory: apps/admin-dashboard

      - name: Deactivate dedicated QA stores
        if: always()
        shell: bash
        run: |
          set +e
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_script="/tmp/aagam-provision-live-qa-${GITHUB_RUN_ID}.js"
          remote_cleanup="/tmp/aagam-live-qa-cleanup-${GITHUB_RUN_ID}.json"
          printf '{"mode":"cleanup"}' > /tmp/aagam-live-qa-cleanup.json
          scp -q "${ssh_options[@]}" /tmp/aagam-live-qa-cleanup.json "$target:$remote_cleanup"
          printf -v app_path '%q' "$DEPLOY_PATH"
          printf -v script_path '%q' "$remote_script"
          printf -v cleanup_path '%q' "$remote_cleanup"
          ssh "${ssh_options[@]}" "$target" "cd $app_path && node $script_path < $cleanup_path; rm -f $script_path $cleanup_path /tmp/aagam-live-qa-input-${GITHUB_RUN_ID}.json"

      - name: Upload W1-W7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-store-owner-w1-w7-evidence
          path: docs/qa/live-store-owner-w1-w7
          if-no-files-found: warn
          retention-days: 30
