name: Live Store Owner W1-W7

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/provision-live-qa-store-owner.js"
      - "apps/admin-dashboard/e2e/live-store-owner-w1-w7.spec.ts"
      - "apps/admin-dashboard/e2e/playwright.live-store.config.ts"
      - ".github/workflows/live-store-owner-w1-w7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-store-owner-w1-w7-main
  cancel-in-progress: true

jobs:
  live-store-owner-w1-w7:
    name: Provision isolated QA stores and run W1-W7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    env:
      NODE_VERSION: "22.22.3"
      LIVE_BASE_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PUBLIC_HEALTHCHECK_URL: ${{ vars.PUBLIC_HEALTHCHECK_URL }}
      EXPECTED_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout deployed main revision
        uses: actions/checkout@v4

      - name: Validate protected production configuration
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_ENV_FILE_B64: ${{ secrets.PRODUCTION_ENV_FILE_B64 }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$LIVE_BASE_URL" ]] || missing+=("PRODUCTION_URL")
          [[ -n "$DEPLOY_HOST" ]] || missing+=("DEPLOY_HOST")
          [[ -n "$DEPLOY_USER" ]] || missing+=("DEPLOY_USER")
          [[ -n "$DEPLOY_PATH" ]] || missing+=("DEPLOY_PATH")
          [[ -n "$SSH_PRIVATE_KEY" ]] || missing+=("DEPLOY_SSH_PRIVATE_KEY")
          [[ -n "$SSH_KNOWN_HOSTS" ]] || missing+=("DEPLOY_KNOWN_HOSTS")
          [[ -n "$PRODUCTION_ENV_FILE_B64" ]] || missing+=("PRODUCTION_ENV_FILE_B64")
          if (( ${#missing[@]} )); then
            printf 'Missing protected configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Derive dedicated QA credentials from protected secret material
        shell: bash
        env:
          PRODUCTION_ENV_FILE_B64: ${{ secrets.PRODUCTION_ENV_FILE_B64 }}
        run: |
          set -Eeuo pipefail
          qa_email="live.qa.store.owner@aagam.test"
          digest="$(printf '%s' "${PRODUCTION_ENV_FILE_B64}:AAGAM_LIVE_QA_STORE_OWNER_V2" | sha256sum | awk '{print $1}')"
          qa_password="Qa!9${digest:0:36}"
          echo "::add-mask::$qa_password"
          echo "LIVE_QA_STORE_EMAIL=$qa_email" >> "$GITHUB_ENV"
          echo "LIVE_QA_STORE_PASSWORD=$qa_password" >> "$GITHUB_ENV"

      - name: Configure production SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

      - name: Wait for this exact main revision in production
        shell: bash
        run: |
          set -Eeuo pipefail
          health_url="${PUBLIC_HEALTHCHECK_URL:-${LIVE_BASE_URL%/}/api/health}"
          for attempt in $(seq 1 120); do
            body="$(curl --location --silent --show-error --max-time 15 "$health_url" || true)"
            if HEALTH_BODY="$body" node -e '
              let value;
              try { value = JSON.parse(process.env.HEALTH_BODY || "{}"); } catch { process.exit(1); }
              if (value.status !== "ok" || value.revision !== process.env.EXPECTED_REVISION) process.exit(1);
            '; then
              echo "Production is serving exact revision $EXPECTED_REVISION"
              exit 0
            fi
            echo "Waiting for exact production revision ($attempt/120)"
            sleep 10
          done
          echo "Production did not reach revision $EXPECTED_REVISION"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/admin-dashboard

      - name: Prepare protected bootstrap input
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p docs/qa/live-store-owner-w1-w7
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('/tmp/aagam-live-qa-provision.json', JSON.stringify({
            mode: 'provision',
            email: process.env.LIVE_QA_STORE_EMAIL,
            password: process.env.LIVE_QA_STORE_PASSWORD,
          }));
          NODE
          chmod 600 /tmp/aagam-live-qa-provision.json

      - name: Provision inactive dedicated QA owner and stores
        id: provision
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          scp_options=(
            -i "$HOME/.ssh/deploy_key"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_script="${DEPLOY_PATH%/}/scripts/provision-live-qa-store-owner.js"
          remote_input="${DEPLOY_PATH%/}/.aagam-live-qa-provision-${GITHUB_RUN_ID}.json"
          scp -q "${scp_options[@]}" /tmp/aagam-live-qa-provision.json "$target:$remote_input"
          printf -v app_path '%q' "$DEPLOY_PATH"
          printf -v script_path '%q' "$remote_script"
          printf -v input_path '%q' "$remote_input"
          ssh "${ssh_options[@]}" "$target" "cd $app_path && node $script_path < $input_path" \
            > docs/qa/live-store-owner-w1-w7/bootstrap.json

      - name: Export QA identifiers and prepare restore state
        id: export
        if: steps.provision.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('docs/qa/live-store-owner-w1-w7/bootstrap.json', 'utf8'));
          const rows = {
            LIVE_QA_STORE_A_ID: value.storeA.id,
            LIVE_QA_STORE_A_NAME: value.storeA.name,
            LIVE_QA_MARKER_A: value.storeA.markerName,
            LIVE_QA_STORE_B_ID: value.storeB.id,
            LIVE_QA_STORE_B_NAME: value.storeB.name,
            LIVE_QA_MARKER_B: value.storeB.markerName,
            LIVE_QA_PRODUCT_ID: value.testProduct.id,
          };
          for (const [key, item] of Object.entries(rows)) {
            if (!item || String(item).includes('\n')) throw new Error(`Invalid bootstrap output for ${key}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${item}\n`);
          }
          fs.writeFileSync('/tmp/aagam-live-qa-cleanup.json', JSON.stringify({
            mode: 'cleanup',
            productSnapshot: value.productSnapshot,
          }));
          fs.writeFileSync('/tmp/aagam-live-qa-visibility.json', JSON.stringify({ mode: 'visibility-on' }));
          NODE
          chmod 600 /tmp/aagam-live-qa-cleanup.json /tmp/aagam-live-qa-visibility.json

      - name: Run inactive-store core scenarios W1-W5 and W7
        id: core
        if: steps.export.outcome == 'success'
        continue-on-error: true
        env:
          LIVE_QA_PHASE: core
        run: npx playwright test -c e2e/playwright.live-store.config.ts
        working-directory: apps/admin-dashboard

      - name: Activate only isolated Store A for W6
        id: visibility_enable
        if: always() && steps.export.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          scp_options=(
            -i "$HOME/.ssh/deploy_key"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_script="${DEPLOY_PATH%/}/scripts/provision-live-qa-store-owner.js"
          remote_input="${DEPLOY_PATH%/}/.aagam-live-qa-visibility-${GITHUB_RUN_ID}.json"
          scp -q "${scp_options[@]}" /tmp/aagam-live-qa-visibility.json "$target:$remote_input"
          printf -v app_path '%q' "$DEPLOY_PATH"
          printf -v script_path '%q' "$remote_script"
          printf -v input_path '%q' "$remote_input"
          ssh "${ssh_options[@]}" "$target" "cd $app_path && node $script_path < $input_path" \
            > docs/qa/live-store-owner-w1-w7/visibility-bootstrap.json

      - name: Run isolated customer-visibility scenario W6
        id: visibility
        if: always() && steps.visibility_enable.outcome == 'success'
        continue-on-error: true
        env:
          LIVE_QA_PHASE: visibility
        run: npx playwright test -c e2e/playwright.live-store.config.ts
        working-directory: apps/admin-dashboard

      - name: Restore catalogue product and deactivate QA stores
        id: cleanup
        if: always() && steps.provision.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -s /tmp/aagam-live-qa-cleanup.json ]]; then
            node - <<'NODE'
            const fs = require('fs');
            const path = 'docs/qa/live-store-owner-w1-w7/bootstrap.json';
            if (!fs.existsSync(path)) throw new Error('Bootstrap output is unavailable for cleanup.');
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            fs.writeFileSync('/tmp/aagam-live-qa-cleanup.json', JSON.stringify({
              mode: 'cleanup',
              productSnapshot: value.productSnapshot,
            }));
            NODE
            chmod 600 /tmp/aagam-live-qa-cleanup.json
          fi
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          scp_options=(
            -i "$HOME/.ssh/deploy_key"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_script="${DEPLOY_PATH%/}/scripts/provision-live-qa-store-owner.js"
          remote_provision="${DEPLOY_PATH%/}/.aagam-live-qa-provision-${GITHUB_RUN_ID}.json"
          remote_visibility="${DEPLOY_PATH%/}/.aagam-live-qa-visibility-${GITHUB_RUN_ID}.json"
          remote_cleanup="${DEPLOY_PATH%/}/.aagam-live-qa-cleanup-${GITHUB_RUN_ID}.json"
          scp -q "${scp_options[@]}" /tmp/aagam-live-qa-cleanup.json "$target:$remote_cleanup"
          printf -v app_path '%q' "$DEPLOY_PATH"
          printf -v script_path '%q' "$remote_script"
          printf -v cleanup_path '%q' "$remote_cleanup"
          printf -v provision_path '%q' "$remote_provision"
          printf -v visibility_path '%q' "$remote_visibility"
          ssh "${ssh_options[@]}" "$target" "cd $app_path; node $script_path < $cleanup_path; status=\$?; rm -f $cleanup_path $provision_path $visibility_path; exit \$status" \
            > docs/qa/live-store-owner-w1-w7/cleanup.json

      - name: Build combined QA report
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          report="docs/qa/live-store-owner-w1-w7/REPORT.md"
          mkdir -p "$(dirname "$report")"
          {
            echo "# AAGAM Live Store Owner W1-W7"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Provision outcome: ${{ steps.provision.outcome }}"
            echo "- Export outcome: ${{ steps.export.outcome }}"
            echo "- Core outcome: ${{ steps.core.outcome }}"
            echo "- Visibility activation outcome: ${{ steps.visibility_enable.outcome }}"
            echo "- W6 outcome: ${{ steps.visibility.outcome }}"
            echo "- Cleanup outcome: ${{ steps.cleanup.outcome }}"
            echo
            if [[ -f docs/qa/live-store-owner-w1-w7/core/REPORT.md ]]; then
              cat docs/qa/live-store-owner-w1-w7/core/REPORT.md
            else
              echo "Core scenario report was not generated."
            fi
            echo
            if [[ -f docs/qa/live-store-owner-w1-w7/visibility/REPORT.md ]]; then
              cat docs/qa/live-store-owner-w1-w7/visibility/REPORT.md
            else
              echo "Visibility scenario report was not generated."
            fi
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload W1-W7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-store-owner-w1-w7-evidence
          path: docs/qa/live-store-owner-w1-w7
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce final QA result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ steps.provision.outcome }}" == "success" ]]
          [[ "${{ steps.export.outcome }}" == "success" ]]
          [[ "${{ steps.core.outcome }}" == "success" ]]
          [[ "${{ steps.visibility_enable.outcome }}" == "success" ]]
          [[ "${{ steps.visibility.outcome }}" == "success" ]]
          [[ "${{ steps.cleanup.outcome }}" == "success" ]]
