name: Live Store Owner W1-W7

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/provision-live-qa-store-owner.js"
      - "apps/admin-dashboard/e2e/live-store-owner-w1-w7.spec.ts"
      - "apps/admin-dashboard/e2e/playwright.live-store.config.ts"
      - ".github/workflows/live-store-owner-w1-w7.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-store-owner-w1-w7-main
  cancel-in-progress: true

jobs:
  safety-hold:
    name: Live QA safety hold
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live QA runner is held while production-isolation corrections are applied."
