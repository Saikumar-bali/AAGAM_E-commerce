name: Regional routing zone compatibility

on:
  push:
    branches:
      - feature/regional-multi-rider-route-splitting
    paths:
      - .github/workflows/regional-routing-zone-compat.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regional-multi-rider-route-splitting
          fetch-depth: 0
      - name: Add stable code to legacy zone creation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/api-gateway/src/stores/store.service.ts')
          text = path.read_text()
          old = """    const last = await prisma.deliveryZone.aggregate({ _max: { sortOrder: true } });
              try {
                return await prisma.deliveryZone.create({ data: { name, sortOrder: (last._max.sortOrder || 0) + 1 } });
              } catch (error: any) {"""
          new = """    const last = await prisma.deliveryZone.aggregate({ _max: { sortOrder: true } });
              const baseCode = name.toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'ZONE';
              let code = baseCode;
              for (let suffix = 1; await prisma.deliveryZone.findUnique({ where: { code } }); suffix += 1) {
                code = `${baseCode.slice(0, 40)}-${suffix}`;
              }
              try {
                return await prisma.deliveryZone.create({ data: { name, code, sortOrder: (last._max.sortOrder || 0) + 1 } });
              } catch (error: any) {"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'legacy zone creation: expected one match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/regional-routing-zone-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api-gateway/src/stores/store.service.ts .github/workflows/regional-routing-zone-compat.yml
          git commit -m "fix(routing): derive stable codes for legacy delivery zones"
          git push origin HEAD:feature/regional-multi-rider-route-splitting
