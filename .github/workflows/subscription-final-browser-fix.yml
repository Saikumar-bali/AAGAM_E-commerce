name: Validate final subscription browser corrections

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/subscription-delivery-runs-cod'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aagam_browser_fix
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aagam_browser_fix
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: aagam-ci-only-jwt-secret-change-me-in-production
      PLAYWRIGHT_QA: 'true'
      PLAYWRIGHT_QA_SEED: 'true'
      ADMIN_EMAIL: admin@aagam.com
      ADMIN_PASSWORD: admin@2026!
      CUSTOMER_EMAIL: customer@aagam.com
      CUSTOMER_PASSWORD: customer@2026!
      STORE_EMAIL: store@aagam.com
      STORE_PASSWORD: store@2026!
      RIDER_EMAIL: rider@aagam.com
      RIDER_PASSWORD: rider@2026!
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscription-delivery-runs-cod
          fetch-depth: 0
      - name: Apply and validate browser corrections
        env:
          TARGET_BRANCH: feature/subscription-delivery-runs-cod
          PATCH_SHA256: 093ee73932ddb50ba0d31531dbc06d9b28821ed2f5a277183151b2208442f049
          PATCH_XZ_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_XZ_BASE64" | base64 --decode > /tmp/subscription-final-browser.patch.xz
          echo "$PATCH_SHA256  /tmp/subscription-final-browser.patch.xz" | sha256sum -c -
          xz -dc /tmp/subscription-final-browser.patch.xz > /tmp/subscription-final-browser.patch
          git apply --check /tmp/subscription-final-browser.patch
          git apply --index /tmp/subscription-final-browser.patch
          git rm .github/workflows/subscription-final-browser-fix.yml

          npm ci --no-audit --no-fund
          npx prisma generate --schema packages/database/prisma/schema.prisma
          npx prisma validate --schema packages/database/prisma/schema.prisma
          npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
          node packages/database/seed.js
          node apps/admin-dashboard/tests/qa-seed.js
          npx tsc --project packages/types/tsconfig.json
          npx tsc --project packages/utils/tsconfig.json
          npx tsc --project packages/database/tsconfig.json
          npx playwright install chromium --with-deps
          npx turbo build --filter=@aagam/api-gateway --filter=@aagam/admin-dashboard --force
          node apps/api-gateway/dist/src/main.js > /tmp/aagam-api.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3005/health >/dev/null && break; sleep 2; done
          CI=true NEXT_PUBLIC_API_URL=http://localhost:3005 PLAYWRIGHT_WORKERS=2 \
            npx playwright test e2e/responsive-role-navigation.spec.ts tests/subscription-delivery-runs-ui.spec.ts --project=chromium --reporter=list --workers=2
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(subscriptions): complete browser release gates'
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${{ github.event.pull_request.head.sha }}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
